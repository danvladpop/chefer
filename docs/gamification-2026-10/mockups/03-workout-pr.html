<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>03 Workout summary — new PR</title>
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <div class="phone" data-tab="none" style="background: #1f1712; color: #fff" data-dark="1">
      <div class="confetti" data-n="34" data-top="20" data-h="300"></div>
      <div class="scroll" style="position: relative; z-index: 2; gap: 14px">
        <div class="between" style="padding-top: 4px">
          <span class="small" style="color: #cfc6bc">Upper A · 52 min</span
          ><span class="small" style="color: #cfc6bc">Done</span>
        </div>

        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            padding-top: 10px;
          "
        >
          <div
            style="
              width: 112px;
              height: 112px;
              border-radius: 999px;
              background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 60%, #b45309);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 52px;
              box-shadow:
                0 0 0 8px rgba(245, 158, 11, 0.18),
                0 0 0 18px rgba(245, 158, 11, 0.08);
            "
          >
            🏅
          </div>
          <span class="pill" style="background: #f59e0b; color: #1f1712; margin-top: 10px"
            >NEW PERSONAL RECORD</span
          >
          <h1 style="color: #fff; font-size: 30px; line-height: 36px">Bench press</h1>
          <div
            style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 48px"
          >
            65 kg <span style="font-size: 22px; color: #fbbf24">× 6</span>
          </div>
          <p style="color: #cfc6bc">+2.5 kg on your best · est. 1RM 78 kg</p>
        </div>

        <!-- Mini PR timeline: shows the climb, not just the point -->
        <section class="card" style="background: #2b2520; border-color: #3a332d; gap: 8px">
          <div class="between">
            <h3 style="color: #fff">Your bench, last 8 weeks</h3>
            <span class="small" style="color: #a69b90">+10 kg</span>
          </div>
          <svg viewBox="0 0 330 70" width="100%" height="70">
            <polyline
              fill="none"
              stroke="#f59e0b"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              points="5,60 50,55 95,52 140,44 185,40 230,30 275,26 322,10"
            />
            <circle cx="322" cy="10" r="6" fill="#fbbf24" stroke="#1f1712" stroke-width="2" />
          </svg>
        </section>

        <section class="card" style="background: #2b2520; border-color: #3a332d; gap: 8px">
          <div class="between" style="color: #cfc6bc">
            <span>💪 Workout complete</span
            ><span style="color: #fbbf24; font-weight: 700">+40</span>
          </div>
          <div class="between" style="color: #cfc6bc">
            <span>🏅 PR · Bench press</span
            ><span style="color: #fbbf24; font-weight: 700">+20</span>
          </div>
          <div class="between" style="color: #cfc6bc">
            <span>🔁 Rep PR · Pull-up (11)</span
            ><span style="color: #fbbf24; font-weight: 700">+10</span>
          </div>
          <div class="between" style="color: #cfc6bc">
            <span>🔥 Week goal met — 3 of 3</span
            ><span style="color: #fbbf24; font-weight: 700">+50</span>
          </div>
          <div class="divider" style="background: #3a332d"></div>
          <div class="between">
            <b>Week streak</b
            ><span class="flame"
              >🔥 7 weeks
              <span class="small" style="color: #a69b90; font-weight: 600"
                >· +1 flex token</span
              ></span
            >
          </div>
        </section>

        <div class="row" style="gap: 10px; margin-top: auto">
          <button class="btn" style="flex: 1; background: #3a332d; color: #fff">
            Share PR card
          </button>
          <button class="btn" style="flex: 1; background: #f59e0b; color: #1f1712">
            Collect +120 XP
          </button>
        </div>
      </div>
    </div>
    <script src="shell.js"></script>
  </body>
</html>
