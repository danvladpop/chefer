<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>09 You — chef card</title>
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <div class="phone" data-tab="you">
      <div class="scroll">
        <div class="topbar">
          <h1>You</h1>
          <span class="ibtn">⚙︎</span>
        </div>

        <!-- Chef card: identity + level + showcase -->
        <section class="card" style="padding: 0; overflow: hidden; gap: 0">
          <div
            style="
              background: linear-gradient(135deg, #f6eadb, #fbe3c4);
              padding: 16px 14px 14px;
              display: flex;
              gap: 14px;
              align-items: center;
            "
          >
            <div style="position: relative; width: 74px; height: 74px; flex: none">
              <svg viewBox="0 0 74 74" width="74" height="74">
                <circle cx="37" cy="37" r="33" fill="none" stroke="#fff" stroke-width="6" />
                <circle
                  cx="37"
                  cy="37"
                  r="33"
                  fill="none"
                  stroke="#944a00"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-dasharray="207.3"
                  stroke-dashoffset="48"
                  transform="rotate(-90 37 37)"
                />
              </svg>
              <div
                style="
                  position: absolute;
                  inset: 9px;
                  border-radius: 999px;
                  background: #944a00;
                  color: #fff;
                  font-weight: 700;
                  font-size: 20px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                DP
              </div>
              <span
                style="
                  position: absolute;
                  bottom: -4px;
                  right: -4px;
                  background: #fff;
                  border: 2px solid #944a00;
                  color: #944a00;
                  font-weight: 800;
                  font-size: 12px;
                  border-radius: 999px;
                  padding: 0 6px;
                "
                >7</span
              >
            </div>
            <div class="grow">
              <h2>Dan</h2>
              <div style="font-size: 13px; font-weight: 700; color: var(--brand)">
                Line Cook · Lv 7
              </div>
              <div class="small" style="margin-top: 2px">385 / 500 XP · 🔥 6-week flame</div>
            </div>
            <div class="biscuit" title="Biscuit">🐶</div>
          </div>
          <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
            <div class="between">
              <span class="eyebrow">Showcase</span
              ><span class="small" style="color: var(--brand); font-weight: 600">Edit</span>
            </div>
            <div class="row" style="gap: 14px">
              <div
                class="badge gold"
                style="width: 52px; height: 52px; font-size: 24px; border-radius: 14px"
              >
                🍳
              </div>
              <div
                class="badge silver"
                style="width: 52px; height: 52px; font-size: 24px; border-radius: 14px"
              >
                🌍
              </div>
              <div
                class="badge gold"
                style="width: 52px; height: 52px; font-size: 24px; border-radius: 14px"
              >
                🔥
              </div>
              <span class="grow"></span>
              <span class="sub" style="text-align: right"
                >23 of 64<br /><b style="color: var(--brand)">See all ›</b></span
              >
            </div>
          </div>
        </section>

        <!-- Lifetime stats: the "endowed progress" that makes leaving feel costly -->
        <section style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px">
          <div class="card" style="padding: 10px; gap: 2px; align-items: center">
            <b style="font-size: 21px">37</b><span class="small">meals cooked</span>
          </div>
          <div class="card" style="padding: 10px; gap: 2px; align-items: center">
            <b style="font-size: 21px">48</b><span class="small">workouts</span>
          </div>
          <div class="card" style="padding: 10px; gap: 2px; align-items: center">
            <b style="font-size: 21px">14</b><span class="small">PRs</span>
          </div>
        </section>

        <section class="card" style="gap: 2px; padding: 4px 14px">
          <div class="between" style="min-height: 46px">
            <span>🏆 Achievements</span><span class="sub">23 ›</span>
          </div>
          <div class="divider"></div>
          <div class="between" style="min-height: 46px">
            <span>🎯 Challenges</span><span class="pill amber">2 active</span>
          </div>
          <div class="divider"></div>
          <div class="between" style="min-height: 46px">
            <span>📅 Monthly recaps</span><span class="sub">›</span>
          </div>
          <div class="divider"></div>
          <div class="between" style="min-height: 46px">
            <span>👥 Kitchen crew</span><span class="sub">3 friends ›</span>
          </div>
        </section>
        <span class="eyebrow">Your progress</span>
        <section class="card" style="gap: 2px; padding: 4px 14px">
          <div class="between" style="min-height: 46px">
            <span>Stats</span><span class="sub">›</span>
          </div>
          <div class="divider"></div>
          <div class="between" style="min-height: 46px">
            <span>My weeks</span><span class="sub">›</span>
          </div>
        </section>
      </div>
    </div>
    <script src="shell.js"></script>
  </body>
</html>
