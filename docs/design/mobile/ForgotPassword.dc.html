<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}

</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">

    <h1 style="margin: 0; font-size: 25px; line-height: 31px; font-weight: 700">Forgot your password?</h1>
    <p style="margin: 0; font-size: 16px; line-height: 22px; color: #8A7560">Enter your email and we'll send you a reset link</p>

    <div style="display: flex; flex-direction: column; gap: 3.5px">

      <input id="forgot-email" type="email" value="dan@example.com" placeholder="you@example.com" autocomplete="email" style="min-height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #E2E8F0; border-radius: 5.25px; padding: 7px 10.5px; font: inherit; font-size: 17px; color: #020817; background: #FFFFFF">
    </div>

    <a href="ForgotSent.dc.html" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 5.25px; background: #944A00; color: #FCF9F5; font-size: 16px; line-height: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Send reset link</a>

    <div style="display: flex; align-items: center; justify-content: center; gap: 3.5px; font-size: 16px; line-height: 22px">
      <span style="color: #8A7560">Remembered it?</span>
      <a href="Login.dc.html" style="min-height: 44px; padding: 0 10.5px; display: flex; align-items: center; font-weight: 600; color: #944A00; text-decoration: none">Sign in</a>
    </div>
  </main>

  <div style="height: 34px; flex: none"></div>
</div>
