<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auth — Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <main id="main" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 21px 14px">
    <h1 style="margin: 0; font-size: 25px; line-height: 31px; font-weight: 700">Forgot your password?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 21px; color: #8a7560">Enter your email and we'll send you a reset link</p>

    <div style="display: flex; flex-direction: column; gap: 3.5px">
      <label for="forgot-password-email" style="font-size: 15px; line-height: 21px; font-weight: 500">Email address</label>
      <input id="forgot-password-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
    </div>

    <a href="ForgotSent.dc.html" style="height: 44px; padding: 0 14px; border: none; border-radius: 5.25px; background: #944a00; color: #fcf9f5; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none">Send reset link</a>

    <div style="display: flex; align-items: center; justify-content: center; gap: 3.5px; font-size: 15px; line-height: 21px">
      <span style="color: #8a7560">Remembered it?</span>
      <a href="Login.dc.html" style="height: 44px; padding: 0 10.5px; border-radius: 5.25px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #944a00; text-decoration: none">Sign in</a>
    </div>
  </main>

  <div style="height: 34px; flex: none"></div>
</div>
</x-dc>

}
}

</body>
</html>
