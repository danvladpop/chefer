<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auth — Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <main id="main" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 21px 14px">
    <h1 style="margin: 0; font-size: 25px; line-height: 31px; font-weight: 700">Choose a new password</h1>
    <p style="margin: 0; font-size: 15px; line-height: 21px; color: #8a7560">This link works once and expires an hour after it was requested</p>

    <div style="display: flex; flex-direction: column; gap: 3.5px">
      <label for="reset-password-password" style="font-size: 15px; line-height: 21px; font-weight: 500">New password</label>
      <div style="position: relative; display: flex; align-items: center">
        <input id="reset-password-password" type="password" autocomplete="off" style="height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 56px 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
        <button type="button" aria-label="Show password" style="position: absolute; top: 0; right: 0; bottom: 0; min-width: 44px; padding: 0 10.5px; border: none; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #944a00; display: flex; align-items: center; justify-content: center">Show</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3.5px">
      <label for="reset-password-confirm" style="font-size: 15px; line-height: 21px; font-weight: 500">Confirm new password</label>
      <input id="reset-password-confirm" type="password" autocomplete="off" style="height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
    </div>

    <button type="button" style="height: 44px; padding: 0 14px; border: none; border-radius: 5.25px; background: #944a00; color: #fcf9f5; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 7px">Reset password</button>
  </main>

  <div style="height: 34px; flex: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
