      <input id="reset-confirm" type="password" value="Oatmeal-Squat-42" autocomplete="new-password" style="min-height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #E2E8F0; border-radius: 5.25px; padding: 7px 10.5px; font: inherit; font-size: 17px; color: #020817; background: #FFFFFF">
    </div>
