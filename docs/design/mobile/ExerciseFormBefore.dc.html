<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before — New exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 2059px; position: relative; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <main id="main" style="display: flex; flex-direction: column; gap: 14px; padding: 7px 14px 28px">
    <div style="display: flex; align-items: center; gap: 10.5px">
      <a href="TrainingExercises.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 9999px; background: #F3F4F6; color: #374151; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

    </div>

    <div style="display: flex; flex-direction: column">
      <label for="exf-name" style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Name</label>
      <input id="exf-name" aria-label="Exercise name" placeholder="e.g. Cable pull-through" value="Landmine Press" style="min-height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #E2E8F0; border-radius: 5.25px; padding: 7px 10.5px; font: inherit; font-size: 17px; color: #020817; background: #FFFFFF">
    </div>

    <div role="group" aria-label="Category" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Category</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Compound</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Isolation</button>
      </div>
    </div>

    <div role="group" aria-label="Equipment" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Equipment</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Barbell</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Dumbbell</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Cable</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Machine</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Bodyweight</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Smith machine</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">EZ bar</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Kettlebell</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Band</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Assisted</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Treadmill</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Bike</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Rower</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Elliptical</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Stair climber</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Ski erg</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Assault bike</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Jump rope</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Pool</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Outdoor</button>
      </div>
    </div>

    <div role="group" aria-label="Load type" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Load type</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Weighted</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Bodyweight</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Bodyweight + load</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Assisted</button>
      </div>
    </div>

    <div role="group" aria-label="Primary muscles" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Primary muscles</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Chest</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Front delts</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Side delts</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Rear delts</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Lats</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Upper back</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Traps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Biceps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Triceps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Forearms</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Quads</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Hamstrings</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Glutes</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Adductors</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Abductors</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Calves</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Abs</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Obliques</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Lower back</button>
      </div>
    </div>

    <div role="group" aria-label="Secondary muscles" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Secondary muscles</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Side delts</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Rear delts</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Lats</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Upper back</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Traps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Biceps</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Triceps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Forearms</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Quads</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Hamstrings</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Glutes</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Adductors</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Abductors</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Calves</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Abs</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Obliques</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Lower back</button>
      </div>
    </div>

    <div role="group" aria-label="Rep range" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Rep range</span>
      <div style="display: flex; align-items: center; gap: 10.5px">
        <div style="display: flex; align-items: center; gap: 3.5px">
          <button type="button" aria-label="Decrease minimum reps" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">−</button>
          <span style="min-width: 42px; min-height: 44px; padding: 0 3.5px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">8</span>
          <button type="button" aria-label="Increase minimum reps" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">+</button>
        </div>
        <span style="font-size: 16px; color: #8A7560">to</span>
        <div style="display: flex; align-items: center; gap: 3.5px">
          <button type="button" aria-label="Decrease maximum reps" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">−</button>
          <span style="min-width: 42px; min-height: 44px; padding: 0 3.5px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">12</span>
          <button type="button" aria-label="Increase maximum reps" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">+</button>
        </div>
      </div>
    </div>

    <div role="group" aria-label="Rest" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">Rest</span>
      <div style="display: flex; align-items: center; gap: 3.5px">
        <button type="button" aria-label="Decrease rest seconds" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">−</button>
        <span style="min-width: 42px; min-height: 44px; padding: 0 3.5px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">90s</span>
        <button type="button" aria-label="Increase rest seconds" style="width: 44px; height: 44px; border: none; border-radius: 5.25px; background: #FAF5F0; color: #020817; font: inherit; font-size: 21px; font-weight: 600">+</button>
      </div>
    </div>

    <div role="group" aria-label="How do you track it?" style="display: flex; flex-direction: column">
      <span style="margin-bottom: 3.5px; font-size: 16px; line-height: 22px; font-weight: 500">How do you track it?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; border: 1px solid #944A00; border-radius: 9999px; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; font-weight: 500">Weight × reps</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Reps only</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Time</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Time + distance</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; border: 1px solid #E2E8F0; border-radius: 9999px; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; font-weight: 500">Distance</button>
      </div>
    </div>
