<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup — Training days</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <div style="flex: none; display: flex; align-items: center; gap: 7px; padding: 10.5px 14px">
    <a href="OnbStart.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; color: #020817; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5l-7 7 7 7M4 12h16"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 14px; line-height: 19px; color: #8A7560">Step 2 of 6 · 33%</span>
      <h1 style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600">Which days do you usually train?</h1>
    </div>
  </div>
  <div role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2" style="flex: none; margin: 0 14px 7px; height: 5.25px; border-radius: 9999px; background: #F3F4F6; overflow: hidden"><div style="height: 100%; width: 33%; border-radius: 9999px; background: #944A00"></div></div>

  <main id="main" style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 10.5px 14px 28px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 16px; line-height: 22px; color: #8A7560">We’ll plan more food on these days and remind you to train. You can change them any time.</p>

      <div role="group" aria-label="Training days" style="display: flex; gap: 1.75px">
        <button type="button" aria-pressed="true" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #944A00; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Mon</button>
        <button type="button" aria-pressed="false" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Tue</button>
        <button type="button" aria-pressed="true" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #944A00; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Wed</button>
        <button type="button" aria-pressed="false" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Thu</button>
        <button type="button" aria-pressed="true" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #944A00; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Fri</button>
        <button type="button" aria-pressed="true" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #944A00; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Sat</button>
        <button type="button" aria-pressed="false" style="flex: 1; min-width: 44px; min-height: 44px; padding: 7px 0; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Sun</button>
      </div>

      <p style="margin: 0; font-size: 16px; line-height: 22px; color: #8A7560">4 days a week</p>

      <div style="display: flex; flex-direction: column; gap: 10.5px; border-top: 1px solid #E2E8F0; padding-top: 10.5px">
        <span style="font-size: 14px; line-height: 19px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #6B7280">Are any of these days a run?</span>

        <div style="display: flex; flex-direction: column; gap: 5.25px">
          <span style="font-size: 16px; line-height: 22px; color: #374151">Monday</span>
          <div style="display: flex; flex-wrap: wrap; gap: 7px">
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Run</button>
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Long run</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5.25px">
          <span style="font-size: 16px; line-height: 22px; color: #374151">Wednesday</span>
          <div style="display: flex; flex-wrap: wrap; gap: 7px">
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Run</button>
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Long run</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5.25px">
          <span style="font-size: 16px; line-height: 22px; color: #374151">Friday</span>
          <div style="display: flex; flex-wrap: wrap; gap: 7px">
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Run</button>
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Long run</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5.25px">
          <span style="font-size: 16px; line-height: 22px; color: #374151">Saturday</span>
          <div style="display: flex; flex-wrap: wrap; gap: 7px">
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #020817; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Run</button>
            <button type="button" aria-pressed="true" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #944A00; background: #944A00; color: #FCF9F5; font: inherit; font-size: 16px; line-height: 22px; font-weight: 500">Long run</button>
          </div>
        </div>
      </div>

      <a href="OnbDiet.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 22px; font-weight: 600; color: #944A00; text-decoration: none">Not sure yet</a>
    </div>
  </main>

  <div style="flex: none; display: flex; flex-direction: column; gap: 7px; border-top: 1px solid #E2E8F0; background: #FFFFFF; padding: 10.5px 14px 7px">
    <a href="OnbDiet.dc.html" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 5.25px; background: #944A00; color: #FCF9F5; font-size: 16px; line-height: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
  </div>
  <div style="height: 34px; flex: none"></div>
</div>
