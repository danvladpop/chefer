<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <main id="main" style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 21px 14px">
    <div style="display: flex; flex-direction: column; gap: 3.5px">
      <span style="font-size: 14px; line-height: 19px; color: #8A7560">One last thing</span>
      <h1 style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600">Want a nudge to log dinner or plan Sunday?</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3.5px">
      <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10.5px; padding: 3.5px 0">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 22px; font-weight: 500; color: #111827">Log dinner</span>
          <span style="font-size: 14px; line-height: 19px; color: #8A7560">At 20:30 on evenings when dinner isn’t logged yet.</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-label="Log dinner" style="width: 51px; height: 31px; flex: none; padding: 2px; border: none; border-radius: 9999px; background: #944A00; display: flex; justify-content: flex-end"><span style="width: 27px; height: 27px; border-radius: 9999px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2)"></span></button>
      </div>
      <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10.5px; padding: 3.5px 0">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 22px; font-weight: 500; color: #111827">Plan Sunday</span>
          <span style="font-size: 14px; line-height: 19px; color: #8A7560">A Sunday evening nudge to pick next week’s dinners.</span>
        </div>
        <button type="button" role="switch" aria-checked="false" aria-label="Plan Sunday" style="width: 51px; height: 31px; flex: none; padding: 2px; border: none; border-radius: 9999px; background: #D1D5DB; display: flex; justify-content: flex-start"><span style="width: 27px; height: 27px; border-radius: 9999px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2)"></span></button>
      </div>
    </div>

    <p style="margin: 0; font-size: 14px; line-height: 19px; color: #8A7560">Both are off unless you turn them on. Change them any time in Settings → Notifications.</p>
  </main>

  <div style="flex: none; border-top: 1px solid #E2E8F0; background: #FFFFFF; padding: 10.5px 14px 7px">
    <a href="GymSetup.dc.html" style="min-height: 44px; padding: 7px 14px; box-sizing: border-box; border-radius: 5.25px; background: #944A00; color: #FCF9F5; font-size: 16px; line-height: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Done</a>
  </div>
  <div style="height: 34px; flex: none"></div>
</div>

</html>
