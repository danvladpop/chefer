<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym — Number sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <a href="Workout.dc.html" aria-label="Close Bench Press · Weight" style="position: absolute; inset: 0; background: rgba(0,0,0,.4); text-decoration: none"></a>

  <div role="dialog" aria-modal="true" aria-labelledby="number-sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 21px 21px 0 0; box-shadow: 0 -4px 12px -4px rgba(67,42,25,.08), 0 -16px 40px -12px rgba(67,42,25,.18); max-height: 85%; display: flex; flex-direction: column">
    <div style="width: 40px; height: 3.5px; border-radius: 9999px; background: #d1d5db; margin: 7px auto 0"></div>
    <div style="padding: 10.5px 14px 7px; display: flex; align-items: center; justify-content: space-between; gap: 10.5px">
      <h1 id="number-sheet-title" style="margin: 0; flex: 1; min-width: 0; font-size: 19px; line-height: 26px; font-weight: 600">Bench Press · Weight</h1>
      <a href="Workout.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 9999px; background: #f3f4f6; color: #374151; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">✕</a>
    </div>

    <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10.5px">
      <div style="padding: 7px 0; display: flex; justify-content: center">
        <output aria-live="polite" style="font-size: 37px; line-height: 42px; font-weight: 700; font-variant-numeric: tabular-nums">62.5<span style="font-size: 19px; font-weight: 400; color: #8a7560"> kg</span></output>
      </div>

      <section aria-label="Plate calculator" style="border-radius: 10.5px; background: #faf5f0; padding: 10.5px; display: flex; flex-direction: column; gap: 7px">
        <span style="font-size: 15px; line-height: 21px; font-weight: 500">Per side, on a 20 kg bar</span>
        <div style="display: flex; flex-wrap: wrap; gap: 7px">
          <span style="min-width: 44px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 5.25px; background: #ffffff; padding: 3.5px 7px; text-align: center; font-size: 17px; line-height: 24px; font-weight: 600">20</span>
          <span style="min-width: 44px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 5.25px; background: #ffffff; padding: 3.5px 7px; text-align: center; font-size: 17px; line-height: 24px; font-weight: 600">1.25</span>
        </div>
      </section>

      <div role="group" aria-label="Keypad" style="display: flex; flex-wrap: wrap; justify-content: space-between; row-gap: 7px">
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">1</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">2</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">3</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">4</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">5</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">6</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">7</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">8</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">9</button>
        <button type="button" aria-label="Decimal point" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">.</button>
        <button type="button" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">0</button>
        <button type="button" aria-label="Delete" style="width: 31%; height: 49px; border: none; border-radius: 10.5px; background: #faf5f0; font: inherit; font-size: 25px; font-weight: 600; color: #020817">⌫</button>
      </div>
    </div>

    <div style="border-top: 1px solid #e2e8f0; padding: 10.5px 14px 0">
      <a href="Workout.dc.html" style="height: 42px; padding: 0 28px; border-radius: 5.25px; background: #944a00; color: #fcf9f5; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Save</a>
    </div>
    <div style="height: 34px; flex: none"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
