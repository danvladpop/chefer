<!doctype html>
<html lang="en">

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #1C1917; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>
  <a href="Workout.dc.html" aria-label="Close Overhead Press options" style="position: absolute; inset: 0; background: rgba(0,0,0,.4); text-decoration: none"></a>
  <div role="dialog" aria-modal="true" aria-labelledby="menu-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 21px 21px 0 0; box-shadow: 0 -4px 12px -4px rgba(67,42,25,.08), 0 -16px 40px -12px rgba(67,42,25,.18); max-height: 85%; display: flex; flex-direction: column">
    <div style="width: 40px; height: 3.5px; border-radius: 9999px; background: #D1D5DB; margin: 7px auto 0"></div>
    <div style="padding: 10.5px 14px 7px; display: flex; align-items: center; justify-content: space-between; gap: 10.5px">
      <h1 id="menu-title" style="margin: 0; flex: 1; min-width: 0; font-size: 19px; line-height: 26px; font-weight: 600; color: #020817">Overhead Press</h1>
      <a href="Workout.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 9999px; background: #F3F4F6; color: #374151; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">✕</a>
    </div>
    <div style="padding: 0 14px 14px; display: flex; flex-direction: column">
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Swap exercise</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Skip exercise</span><span style="font-size: 16px; line-height: 22px; color: #8A7560">Skipping never counts as a miss.</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #EF4444">Remove exercise</span><span style="font-size: 16px; line-height: 22px; color: #8A7560">Removes it from this workout only.</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Add set</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Remove last set</span><span style="font-size: 16px; line-height: 22px; color: #8A7560">Removes the last set you haven’t logged.</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Move up</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Move down</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Superset</span><span style="font-size: 16px; line-height: 22px; color: #8A7560">Do it back to back with other exercises.</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Add note</span></button>
        <button type="button" style="min-height: 42px; border: none; border-bottom: 1px solid #E2E8F0; padding: 7px 3.5px; background: transparent; font: inherit; text-align: left; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 17px; line-height: 24px; font-weight: 500; color: #020817">Exercise history</span></button>
    </div>
    <div style="height: 34px; flex: none"></div>
  </div>
</div>
</x-dc>
