<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Body metrics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#944a00;text-decoration:none}a:hover{color:#6e3700}
input::placeholder,textarea::placeholder{color:#9ca3af}
</style>
</helmet>
<div style="width: 390px; height: 1010px; position: relative; overflow: hidden; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #020817; display: flex; flex-direction: column">
  <div style="height: 47px; flex: none"></div>

  <header style="flex: none; display: flex; align-items: center; gap: 7px; padding: 10.5px 14px">
    <a href="OnbGoal.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: #1f2937; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5l-7 7 7 7M4 12h16"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 13px; line-height: 18px; color: #8a7560">Step 3 of 5 · 60%</span>
      <h1 style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600">Body metrics</h1>
    </div>
  </header>

  <div role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="4" aria-label="Onboarding progress" style="flex: none; margin: 0 14px 7px; height: 5.25px; border-radius: 9999px; background: #f3f4f6; overflow: hidden"><div style="height: 100%; width: 60%; background: #944a00; border-radius: 9999px"></div></div>

  <main id="main" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 10.5px 14px 28px">
    <div style="display: flex; flex-direction: column; gap: 17.5px">

      <div style="display: flex; flex-direction: column; gap: 5.25px">
        <span id="metrics-sex-label" style="font-size: 15px; line-height: 21px; font-weight: 500">Biological sex</span>
        <span style="font-size: 13px; line-height: 18px; color: #8a7560">Used for accurate calorie calculation.</span>
        <div role="group" aria-labelledby="metrics-sex-label" style="display: flex; gap: 7px">
          <button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 1px solid #944a00; border-radius: 5.25px; background: #944a00; color: #fcf9f5; font: inherit; font-size: 15px; font-weight: 500">Male</button>
          <button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 1px solid #e2e8f0; border-radius: 5.25px; background: #ffffff; color: #4b5563; font: inherit; font-size: 15px; font-weight: 500">Female</button>
        </div>
      </div>

      <div style="display: flex; gap: 7px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3.5px">
          <label for="metrics-age" style="font-size: 15px; line-height: 21px; font-weight: 500">Age</label>
          <input id="metrics-age" inputmode="numeric" placeholder="e.g. 30" value="34" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3.5px">
          <label for="metrics-height" style="font-size: 15px; line-height: 21px; font-weight: 500">Height (cm)</label>
          <input id="metrics-height" inputmode="decimal" placeholder="e.g. 175" value="178" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3.5px">
          <label for="metrics-weight" style="font-size: 15px; line-height: 21px; font-weight: 500">Weight (kg)</label>
          <input id="metrics-weight" inputmode="decimal" placeholder="e.g. 75" value="82" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 5.25px; padding: 0 10.5px; font: inherit; font-size: 17px; color: #020817; background: #ffffff">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5.25px">
        <span id="metrics-activity-label" style="font-size: 15px; line-height: 21px; font-weight: 500">Activity level</span>
        <div role="group" aria-labelledby="metrics-activity-label" style="display: flex; flex-direction: column; gap: 7px">
          <button type="button" aria-pressed="false" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10.5px; padding: 10.5px; border: 1px solid #e2e8f0; border-radius: 10.5px; background: #ffffff; font: inherit; color: inherit; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 21px; font-weight: 600; color: #1f2937">Sedentary</span><span style="font-size: 13px; line-height: 18px; color: #8a7560">Little or no exercise, desk job</span></span>
          </button>
          <button type="button" aria-pressed="false" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10.5px; padding: 10.5px; border: 1px solid #e2e8f0; border-radius: 10.5px; background: #ffffff; font: inherit; color: inherit; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 21px; font-weight: 600; color: #1f2937">Lightly Active</span><span style="font-size: 13px; line-height: 18px; color: #8a7560">Light exercise 1–3 days/week</span></span>
          </button>
          <button type="button" aria-pressed="true" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10.5px; padding: 10.5px; border: 1px solid #944a00; border-radius: 10.5px; background: #fcf3ea; font: inherit; color: inherit; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 21px; font-weight: 600; color: #944a00">Moderately Active</span><span style="font-size: 13px; line-height: 18px; color: #8a7560">Moderate exercise 3–5 days/week</span></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#944a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9.5" fill="#944a00" stroke="none"></circle><path d="M7.5 12.3l3 3 6-6" stroke="#ffffff"></path></svg>
          </button>
          <button type="button" aria-pressed="false" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10.5px; padding: 10.5px; border: 1px solid #e2e8f0; border-radius: 10.5px; background: #ffffff; font: inherit; color: inherit; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 21px; font-weight: 600; color: #1f2937">Very Active</span><span style="font-size: 13px; line-height: 18px; color: #8a7560">Hard exercise 6–7 days/week</span></span>
          </button>
          <button type="button" aria-pressed="false" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10.5px; padding: 10.5px; border: 1px solid #e2e8f0; border-radius: 10.5px; background: #ffffff; font: inherit; color: inherit; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 21px; font-weight: 600; color: #1f2937">Athlete</span><span style="font-size: 13px; line-height: 18px; color: #8a7560">Very hard exercise or physical job</span></span>
          </button>
        </div>
      </div>

      <section aria-label="Estimated daily calorie target" style="border: 2px solid rgba(148,74,0,.3); border-radius: 7px; background: #fcf3ea; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 3.5px">
        <span style="font-size: 13px; line-height: 18px; color: #8a7560">Estimated daily calorie target</span>
        <b style="font-size: 31px; line-height: 37px; font-weight: 700; color: #944a00">2,240</b>
        <span style="font-size: 13px; line-height: 18px; color: #8a7560; text-align: center">kcal / day · 2,740 maintenance</span>
      </section>

    </div>
  </main>

  <div style="flex: none; border-top: 1px solid #e2e8f0; padding: 10.5px 14px 7px; display: flex; flex-direction: column; gap: 7px">
    <a href="OnbDiet.dc.html" style="height: 44px; padding: 0 14px; border: none; border-radius: 5.25px; background: #944a00; color: #fcf9f5; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none">Continue</a>
    <a href="FoodToday.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #944a00; text-decoration: none">Skip for now</a>
  </div>

  <div style="height: 34px; flex: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
