name: Deploy

# One-button deploy:
#   • GitHub UI → Actions → Deploy → "Run workflow"
#   • CLI      → gh workflow run deploy.yml
#   • Auto     → any push to master that touches code
#
# Images are built HERE (4 vCPU / 16 GB runner) and pushed to GHCR; the 1 GB
# production VM only pulls them. Building on the VM takes 15-40 min, so this is
# both the "one button" and the speed fix.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (blank = build current master). Use sha-<short> to roll back.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight deploy

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Resolve the tag we are deploying ───────────────────────────────────────
  setup:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      build: ${{ steps.t.outputs.build }}
    steps:
      - id: t
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            # Rollback / redeploy an existing image — skip the build jobs.
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(echo ${{ github.sha }} | head -c7)" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Gate on CI — production must not deploy on red ─────────────────────────
  # CI (ci.yml) runs on the same push; this job polls its check runs for THIS
  # commit and fails if any required check fails. Skipped on the rollback path
  # (build=false) — an already-built image was CI'd when it was first pushed.
  gate:
    name: Wait for CI
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for CI checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exact job names from ci.yml — update both files together.
          required=("Lint" "Type Check" "Unit Tests" "Build")
          echo "Waiting for CI on ${{ github.sha }}: ${required[*]}"
          for attempt in $(seq 1 80); do  # 80 × 15 s = 20 min
            json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            green=0; failed=""
            for name in "${required[@]}"; do
              status=$(echo "$json" | jq -r --arg n "$name" '[.[] | select(.name == $n)] | first | .status // "missing"')
              conclusion=$(echo "$json" | jq -r --arg n "$name" '[.[] | select(.name == $n)] | first | .conclusion // ""')
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  green=$((green + 1))
                else
                  failed="$failed $name($conclusion)"
                fi
              fi
            done
            if [ -n "$failed" ]; then
              echo "::error::CI is red on this commit:$failed — refusing to deploy"
              exit 1
            fi
            if [ "$green" -eq "${#required[@]}" ]; then
              echo "✅ All ${#required[@]} CI checks green — deploying"
              exit 0
            fi
            echo "  attempt $attempt/80: $green/${#required[@]} green, retrying in 15 s…"
            sleep 15
          done
          echo "::error::Timed out waiting for CI after 20 min"
          exit 1

  # ─── Build both images in parallel ──────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    needs: [setup, gate]
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: api
            dockerfile: infrastructure/docker/Dockerfile.api
          - app: web
            dockerfile: infrastructure/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chefer-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/chefer-${{ matrix.app }}:${{ needs.setup.outputs.tag }}
          # NEXT_PUBLIC_* are baked into the web bundle at BUILD time, so they must
          # be supplied here (public URLs → repo Variables, not Secrets). If the
          # public URL ever changes, update these Variables — editing
          # .env.production on the VM alone will NOT change the web bundle.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://chefer.duckdns.org' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://chefer.duckdns.org' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Chefer' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # ─── Deploy to the VM over SSH ──────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    needs: [setup, gate, build]
    # Runs even when gate+build were skipped (rollback path: build=false).
    # A FAILED gate must block — a failed dependency only auto-skips build,
    # and always() would otherwise let the deploy proceed around it.
    if: |
      always() && needs.setup.result == 'success' &&
      (needs.gate.result == 'success' || needs.gate.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # Without this, missing secrets produce ssh's usage dump, which reads like
      # a workflow bug rather than "you haven't configured the repo yet".
      - name: Check deploy secrets are configured
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ]    || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ]    || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions → Secrets."
            echo "The images for this commit were still built and pushed to GHCR."
            exit 1
          fi

      # Plain ssh rather than a third-party action: no extra dependency to pin
      # or trust with the deploy key.
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd ~/chefer && git pull --ff-only && TAG='$TAG' ./infrastructure/scripts/deploy.sh"
        # The pull runs BEFORE the script is invoked (not just inside it):
        # bash executes the file it opened, so a script updated by its own
        # git pull only took effect one deploy later. Pulling first means
        # every deploy runs the deploy script it shipped with.

  # ─── Verify the site is actually healthy ────────────────────────────────────
  verify:
    name: Verify
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll health endpoint
        run: |
          # /api/health routes to the API since A12 (Caddy @apiBackend): it
          # checks API + DB and answers {"ok":true} — same check the external
          # uptime monitor watches.
          URL="${{ vars.DEPLOYMENT_URL || 'https://chefer.duckdns.org' }}/api/health"
          echo "Checking $URL"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL" | grep -q '"ok":true'; then
              echo "✅ Healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: not healthy yet, retrying in 5s…"
            sleep 5
          done
          echo "❌ Site did not become healthy"
          echo "   Debug on the VM: docker compose --env-file .env.production -f docker-compose.deploy.yml logs --tail 50"
          exit 1

      - name: Check web homepage
        run: |
          # /api/health only proves API + DB now — make sure web serves pages too.
          URL="${{ vars.DEPLOYMENT_URL || 'https://chefer.duckdns.org' }}/"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL")
            if [ "$CODE" = "200" ]; then
              echo "✅ Homepage 200 after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: homepage returned $CODE, retrying in 5s…"
            sleep 5
          done
          echo "❌ Homepage did not return 200"
          exit 1
