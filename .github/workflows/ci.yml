name: CI

# The default branch is master — [main, develop] here meant CI never ran
# (roadmap F-3). The Deploy workflow's "Wait for CI" gate polls the four
# job names below by exact name; rename them there too if they change here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pnpm's version comes from package.json's packageManager field — passing it
# to pnpm/action-setup as well makes the action fail on "multiple versions".
env:
  NODE_VERSION: '20'

jobs:
  # ─── Setup & Cache ───────────────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.pnpm-cache.outputs.cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "cache-key=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ─── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  # ─── Typecheck ────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-

      - name: Type check
        run: pnpm typecheck

  # ─── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-

      - name: Run tests
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── UTC-day guard (§2.12, T-21.1/T-00.10) ───────────────────────────────────
  # Grep-based lint: fails on a server-UTC "day" derivation in
  # apps/api/src/application/** outside the allowlist (scripts/check-utc-days.mjs).
  utc-day-guard:
    name: UTC Day Guard
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for server-UTC day derivation
        run: node scripts/check-utc-days.mjs

  # ─── Safety regression (§2.1, T-01.1) ────────────────────────────────────────
  # Every curated recipe x a fixture matrix of safety profiles — the B-26
  # evidence artefact. Wave 0 (T-00.10) scaffolds the job: it runs today with
  # --passWithNoTests (green, no test file yet) and starts enforcing the
  # moment T-01.1 adds apps/api/src/application/safety/safety.regression.test.ts.
  safety-regression:
    name: Safety Regression
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T-26.7 evidence trail: the run (incl. the printed pool-size report) is
      # kept as a build artefact per commit, so "what did the allergen filter
      # do at release X" can be answered later. Retention: PENDING COUNSEL
      # (DPIA / product-liability period) — 400 days is a placeholder.
      - name: Run safety regression suite
        working-directory: apps/api
        run: |
          {
            echo "Chefer safety regression report"
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref_name }}"
            echo "run: ${{ github.run_id }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > safety-regression-report.txt
          npx vitest run --passWithNoTests --reporter=verbose src/application/safety/safety.regression.test.ts 2>&1 | tee -a safety-regression-report.txt

      - name: Archive safety regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-regression-report-${{ github.sha }}
          path: apps/api/safety-regression-report.txt
          if-no-files-found: warn
          retention-days: 400

  # ─── Mobile Bundle ────────────────────────────────────────────────────────────
  # Headless Metro export of the Expo app — catches monorepo-resolution breakage
  # and RN-incompatible imports without any simulator. Maestro E2E stays
  # local-only (macOS runner cost — see mobile_native_plan.md M4-2).
  mobile-bundle:
    name: Mobile Bundle
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export iOS bundle
        run: pnpm mobile:bundle-check
        env:
          CI: true

  # ─── Mobile Contract Tests ────────────────────────────────────────────────────
  # The mobile client's link stack against a real API + seeded Postgres —
  # same DB bootstrap as the E2E job. AI stays mocked (no keys in CI).
  mobile-contract:
    name: Mobile Contract
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chefer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chefer_test
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret-0123456789abcdef012345
      AI_MOCK_ENABLED: 'true'
      EMAIL_MOCK_ENABLED: 'true'
      # The whole suite runs against one API from one IP; the default
      # 100 requests/min limiter returns 429s once the suite grows.
      RATE_LIMIT_MAX: '3000'
      AUTH_RATE_LIMIT_MAX: '200'
      # Following and trainer coaching ship dark; turn them on so friends.* and
      # coaching/trainer contract suites run (they skip themselves when off).
      FEATURE_FLAGS: 'friends,coaching'
      # WP-18: anyone may turn on trainer tools in CI (e-mail allowlist, '*' = all).
      TRAINER_ALLOWLIST: '*'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test database
        # ingredients:sync loads the global catalog, as every deploy does
        # after db push (docker-compose.deploy.yml migrate).
        run: pnpm db:push && pnpm --filter @chefer/database db:ensure-indexes && pnpm ingredients:sync && pnpm db:seed

      - name: Start API
        run: |
          (cd apps/api && pnpm start &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3001/health

      - name: Run contract tests
        run: pnpm mobile:contract
        env:
          CI: true

  # ─── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://chefer.dev' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.chefer.dev' }}
          NEXT_PUBLIC_TRPC_URL: ${{ vars.NEXT_PUBLIC_TRPC_URL || 'https://api.chefer.dev/trpc' }}

  # ─── E2E Tests (public project) ──────────────────────────────────────────────
  # Runs the unauthenticated `public` Playwright project only. The `mobile` and
  # `desktop` projects sign in and assert against real plan data, so they need
  # a seeded fixture dataset in CI — that lands with roadmap P0-8. Locally they
  # run against the dev database: cd tests && pnpm exec playwright test.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chefer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chefer_test
      # CI-only dummies — the api env schema requires 32+ chars at startup.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret-0123456789abcdef012345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @chefer/e2e exec playwright install --with-deps chromium

      - name: Setup test database
        run: pnpm db:push && pnpm --filter @chefer/database db:ensure-indexes && pnpm ingredients:sync

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_TRPC_URL: http://localhost:3001/trpc

      - name: Run public E2E suite
        working-directory: tests
        run: pnpm exec playwright test --project=public
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30
