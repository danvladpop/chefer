# Meal plan E2E — M2-2. Read-only: never taps Generate (alice is PREMIUM and
# dev runs REAL AI — generation costs money and minutes).
# Precondition: signed-in session (any account).
appId: dev.chefer.app
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
# The tab label reads "Plan, tab, 2 of 5" — anchor on that, not bare "Plan"
# (which also appears in empty-state copy).
- tapOn: 'Plan(, tab.*)?'
- extendedWaitUntil:
    visible:
      id: 'plan-week-label'
    timeout: 15000
# Whichever state the week is in, its key content must render
- runFlow:
    when:
      visible:
        id: 'plan-empty'
    commands:
      - assertVisible:
          id: 'plan-generate'
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      - assertVisible:
          id: 'plan-day-0'
      # Replace-meal picker sheet: open from any meal's swap button, check the
      # search field and the AI footer (alice is premium), close WITHOUT
      # selecting — a pick mutates the plan, and the AI button costs money.
      # Anchor on picker-search (TextInput): testIDs on bare Views are
      # invisible to Maestro on iOS.
      - tapOn:
          id: 'plan-day-0'
      - tapOn:
          id: 'plan-meal-swap-.*'
          index: 0
          optional: true
      - runFlow:
          when:
            visible:
              id: 'picker-search'
          commands:
            - assertVisible:
                id: 'picker-ai-swap'
            - tapOn:
                id: 'picker-close'
            - extendedWaitUntil:
                notVisible:
                  id: 'picker-search'
                timeout: 5000
# My Weeks (4-week rotation) — read-only: never save/follow (mutates the plan)
- runFlow:
    when:
      visible:
        id: 'plan-my-weeks'
    commands:
      - tapOn:
          id: 'plan-my-weeks'
      - extendedWaitUntil:
          visible:
            id: 'my-weeks-title'
          timeout: 10000
      - tapOn:
          id: 'my-weeks-back'
      - extendedWaitUntil:
          visible:
            id: 'plan-week-label'
          timeout: 10000

# Week navigation (prev only: the dev-client's floating Tools bubble overlaps
# the top-right week-next button on Android dev builds — production has no FAB)
- tapOn:
    id: 'plan-week-prev'
- extendedWaitUntil:
    visible: 'Past'
    timeout: 10000
