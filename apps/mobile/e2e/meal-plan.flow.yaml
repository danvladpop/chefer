# Meal plan E2E — M2-2. Read-only: never taps Generate (alice is PREMIUM and
# dev runs REAL AI — generation costs money and minutes).
# Precondition: signed-in session (any account).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
# The tab label reads "Plan, tab, 2 of 5" — anchor on that, not bare "Plan"
# (which also appears in empty-state copy).
- tapOn: 'Plan(, tab.*)?'
- extendedWaitUntil:
    visible:
      id: 'plan-week-label'
    timeout: 15000
# Whichever state the week is in, its key content must render
- runFlow:
    when:
      visible:
        id: 'plan-empty'
    commands:
      - assertVisible:
          id: 'plan-generate'
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      - assertVisible:
          id: 'plan-day-0'
      # Replace-meal picker sheet: open from any meal's swap button, check the
      # search field and the AI footer (alice is premium), close WITHOUT
      # selecting — a pick mutates the plan, and the AI button costs money.
      # Anchor on picker-search (TextInput): testIDs on bare Views are
      # invisible to Maestro on iOS.
      - tapOn:
          id: 'plan-day-0'
      - tapOn:
          id: 'plan-meal-swap-.*'
          index: 0
          optional: true
      - runFlow:
          when:
            visible:
              id: 'picker-search'
          commands:
            - assertVisible:
                id: 'picker-ai-swap'
            - tapOn:
                id: 'picker-close'
            - extendedWaitUntil:
                notVisible:
                  id: 'picker-search'
                timeout: 5000
# Plan settings sheet (UX-07 T-07.5) — header "Plan settings" button, only
# once the shape has loaded. Open, assert the form + Save, close WITHOUT
# saving (a save with an existing plan opens the regenerate confirm below).
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      - tapOn:
          id: 'plan-settings-open'
          optional: true
      - runFlow:
          when:
            visible:
              id: 'plan-settings-title'
          commands:
            - assertVisible:
                id: 'plan-settings-save'
            - tapOn:
                id: 'plan-settings-close'
            - extendedWaitUntil:
                notVisible:
                  id: 'plan-settings-title'
                timeout: 5000

# Visible Regenerate action row (UX-08 T-08.2/T-08.3) — under the day chips,
# not only behind the week-summary sheet. It now always asks first: open the
# confirm and Cancel WITHOUT confirming (a confirm would replace the week).
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      - assertVisible:
          id: 'plan-regenerate-action'
      - tapOn:
          id: 'plan-regenerate-action'
      - extendedWaitUntil:
          visible:
            id: 'regenerate-confirm-title'
          timeout: 10000
      - assertVisible:
          id: 'regenerate-confirm-cancel'
      - tapOn:
          id: 'regenerate-confirm-cancel'
      - extendedWaitUntil:
          notVisible:
            id: 'regenerate-confirm-title'
          timeout: 5000

# Week summary sheet (tap the week label) — holds the WEEK-level actions.
# Read-only: assert Regenerate exists but NEVER tap it (real AI cost) — it
# now opens the same confirm as the row above.
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      - tapOn:
          id: 'plan-week-summary'
      - extendedWaitUntil:
          visible:
            id: 'week-summary-title'
          timeout: 10000
      - assertVisible:
          id: 'plan-regenerate'
      # My Weeks (4-week rotation) lives here too — visit and come back
      - tapOn:
          id: 'plan-my-weeks'
      - extendedWaitUntil:
          visible:
            id: 'my-weeks-title'
          timeout: 10000
      - tapOn:
          id: 'my-weeks-back'
      - extendedWaitUntil:
          visible:
            id: 'plan-week-label'
          timeout: 10000

# Week navigation (prev only: the dev-client's floating Tools bubble overlaps
# the top-right week-next button on Android dev builds — production has no FAB)
# The week label row is one flattened a11y element ("14 Sep – 20 Sep Past"),
# so match the badge as a substring of it.
- tapOn:
    id: 'plan-week-prev'
- extendedWaitUntil:
    visible: '.*Past.*'
    timeout: 10000
