# "How long have you got?" — short version E2E (T-36.6, UX-36 (6), AC7).
# Preconditions: signed-in session (connect.yaml signs in as alice if needed)
# and a gym profile with an active routine (run gym-setup.flow.yaml first on a
# fresh account).
# Checks: Gym Today's `Time today:` chips → 20 trims the next workout and
# shows `Short version · ~N min · M exercises` → Start opens a session →
# discard it → set the chip back to Full (the choice is remembered per weekday
# on-device, so leaving it on 20 would leak into the next run).
# Ends in FOOD mode so the food flows are unaffected.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn:
    id: 'mode-switch-gym'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000

# A workout left running by an earlier (failed) run is discarded first.
- runFlow:
    when:
      visible:
        id: 'gym-today-resume'
    commands:
      - tapOn:
          id: 'gym-today-resume-button'
      - extendedWaitUntil:
          visible:
            id: 'workout-title'
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: 'workout-discard'
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: 'workout-discard'
      - tapOn:
          id: 'workout-discard-sheet-confirm'
      - extendedWaitUntil:
          visible:
            id: 'gym-today-title'
          timeout: 15000

# ── Full is the default: no preview ──────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: 'gym-today-time-20'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'gym-today-time-full'
- assertNotVisible:
    id: 'gym-today-short-preview'

# ── 20 minutes → short version preview, then start it ────────────────────────
- tapOn:
    id: 'gym-today-time-20'
- assertVisible:
    id: 'gym-today-short-preview'
- assertVisible:
    text: 'Short version · ~.*'
- tapOn:
    id: 'gym-today-start'
- extendedWaitUntil:
    visible:
      id: 'workout-title'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'workout-discard'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'workout-discard'
- tapOn:
    id: 'workout-discard-sheet-confirm'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000

# ── Back to Full so the next run starts clean ────────────────────────────────
- scrollUntilVisible:
    element:
      id: 'gym-today-time-full'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'gym-today-time-full'
- assertNotVisible:
    id: 'gym-today-short-preview'

- tapOn:
    id: 'mode-switch-food'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
