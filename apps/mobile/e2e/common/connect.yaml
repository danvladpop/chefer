# Cross-platform preamble: get the dev client connected to Metro and clear
# the first-run developer-menu chrome, then ensure a signed-in session.
appId: dev.chefer.app
---
# iOS: relaunching resumes the already-connected dev client.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
# Android: launchApp lands on the dev launcher and a follow-up link races the
# running launcher — cold-start via the deep link instead (localhost works
# through adb reverse tcp:8083).
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      - openLink: chefer://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8083
      - runFlow:
          when:
            visible: 'Development Build'
          commands:
            - tapOn: 'http://.*:8083'

# First-run explainer: Continue opens the dev menu — close it (xmark on iOS,
# hardware back on Android).
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- tapOn:
    id: 'xmark'
    optional: true
- runFlow:
    when:
      platform: Android
      visible: 'Reload'
    commands:
      - back

# Android cold-starts the app each launch and a loaded emulator can take a
# minute to serve the first bundle — wait long here so per-flow waits stay short.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 90000
    optional: true

# Fresh installs/profiles have no session — sign in as the seeded account so
# session-dependent flows hold on any device (costs 1 login when it fires).
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'login-title'
    commands:
      - tapOn:
          id: 'login-email'
      - inputText: 'alice@chefer.dev'
      - tapOn:
          id: 'login-password'
      - inputText: 'User@123!'
      # Android's keyboard covers the button; dismiss it first.
      # Android's keyboard covers the button (iOS hideKeyboard throws — skip it).
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - tapOn:
          id: 'login-submit'
          optional: true
      - extendedWaitUntil:
          visible: 'Not Now'
          timeout: 5000
          optional: true
      - tapOn:
          text: 'Not Now'
          optional: true
