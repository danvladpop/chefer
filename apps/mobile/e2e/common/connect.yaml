# Cross-platform preamble: launch + connect the dev client (launch.yaml),
# ensure a signed-in session, and put the app in FOOD mode so every food flow
# starts on the Home tab regardless of the persisted Food/Gym mode.
appId: dev.chefer.app.dev
---
- runFlow: launch.yaml

# Android cold-starts the app each launch and a loaded emulator can take a
# minute to serve the first bundle — wait long here so per-flow waits stay short.
# The Food|Gym switch is on the tab roots of BOTH modes, so it appears on a
# signed-in launch whichever mode was persisted.
- extendedWaitUntil:
    visible:
      id: 'mode-switch-food'
    timeout: 90000
    optional: true

# Fresh installs/profiles have no session — sign in as the seeded account so
# session-dependent flows hold on any device (costs 1 login when it fires).
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'login-title'
    commands:
      - tapOn:
          id: 'login-email'
      - inputText: 'alice@chefer.dev'
      - tapOn:
          id: 'login-password'
      - inputText: 'User@123!'
      # Android's keyboard covers the button; dismiss it first.
      # Android's keyboard covers the button (iOS hideKeyboard throws — skip it).
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - tapOn:
          id: 'login-submit'
          optional: true
      - extendedWaitUntil:
          visible: 'Not Now'
          timeout: 5000
          optional: true
      - tapOn:
          text: 'Not Now'
          optional: true

# Persisted Gym mode (gym_plan.md D3) opens Gym Today — switch back to Food so
# food flows find the Home tab. (Wait for a tab root first: a sign-in above
# may still be navigating.)
- extendedWaitUntil:
    visible:
      id: 'mode-switch-food'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'gym-today-title'
    commands:
      - tapOn:
          id: 'mode-switch-food'
