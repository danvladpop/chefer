# Trainer coaching E2E (WP-18 lane C, spec §2.4–§2.5): a `runScript` setup registers a trainer and a client
# over HTTP (trainer tools on, client with a routine, linked through an invite); the flow signs in as the
# trainer, opens /trainer (deep link: the "Trainer tools" row belongs to the client-side entry points),
# opens the client, edits the first exercise (a note for the client), saves, and asserts the editor is clean.
#
# Needs: the dev app on a booted simulator/emulator, Metro up, the local API up with coaching on
# (FEATURE_FLAGS=coaching TRAINER_ALLOWLIST=*) — pass `-e API_URL=http://localhost:<port>` when the API
# is not on :3001. Costs 2 registers + 1 login of the per-IP auth budget. Local only (the orchestrator
# runs it).
appId: dev.chefer.app.dev
env:
  API_URL: http://localhost:3001
---
- runScript: scripts/trainer-setup.js
- runFlow: common/connect.yaml

# Whoever is signed in, sign out — this flow signs in as the new trainer.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      - tapOn: 'More(, .*)?'
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
          centerElement: true
      - tapOn:
          id: 'logout-button'
      - runFlow: common/confirm-sign-out.yaml
- extendedWaitUntil:
    visible:
      id: 'welcome-title'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-title'
    commands:
      - tapOn:
          id: 'welcome-sign-in'

# ── Sign in as the trainer ───────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-email'
- inputText: ${output.tEmail}
- tapOn:
    id: 'login-password'
- inputText: ${output.tPassword}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
    optional: true
- tapOn:
    id: 'onboarding-skip'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000

# ── /trainer → the client ────────────────────────────────────────────────────
- openLink: chefer-dev:///trainer
- extendedWaitUntil:
    visible: 'Open'
    timeout: 3000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'trainer-home'
    timeout: 20000
- assertVisible:
    id: 'trainer-home-invite'
- assertVisible: '${output.cName}.*'
- tapOn: '${output.cName}.*'
- extendedWaitUntil:
    visible:
      id: 'trainer-client'
    timeout: 15000
- assertVisible:
    id: 'trainer-client-tab-workouts'
- assertVisible:
    id: 'trainer-client-tab-adherence'
- assertVisible:
    id: 'trainer-client-tab-notes'

# ── Edit routine: a note for the client on the first exercise ────────────────
- tapOn:
    id: 'trainer-client-edit-routine'
- extendedWaitUntil:
    visible:
      id: 'trainer-routine'
    timeout: 20000
- assertVisible:
    id: 'trainer-routine-save'
- tapOn:
    id: 'routine-editor-day-.*-exercise-.*-toggle'
    index: 0
- tapOn:
    id: 'routine-editor-day-.*-exercise-.*-trainer-note-input'
    index: 0
- inputText: 'Slow on the way down'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible:
    id: 'trainer-routine-dirty'
- tapOn:
    id: 'trainer-routine-save'
- extendedWaitUntil:
    notVisible:
      id: 'trainer-routine-dirty'
    timeout: 15000
- assertVisible: 'No changes'
