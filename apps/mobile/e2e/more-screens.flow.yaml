# More-hub screens E2E — M2-7 preferences, M2-8 profile, My weeks (P2-8).
# The tracker (Today → "See full day") and the pantry (Shop → In my kitchen)
# left More in P2-2 / P2-8; dashboard.flow and shopping-list.flow cover them.
# Precondition: signed-in session (any account).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: 'More(, .*)?'

- tapOn:
    id: 'more-profile'
- extendedWaitUntil:
    visible:
      id: 'profile-title'
    timeout: 15000
- assertVisible:
    id: 'profile-user-card'

# Privacy & data (T-39.4): AI & your data, Usage analytics, Consent history,
# a Gym settings row and Download my data / Delete account, in one section.
# The section itself is taller than one screen, so scrollUntilVisible on it
# (or on any row deep inside it) can never reach 100% visibility — scroll to
# the small heading first, then to each card individually (a card below the
# fold on one device is not necessarily below the fold on another, so each
# gets its own scrollUntilVisible rather than assuming one scroll reveals
# the rest).
- scrollUntilVisible:
    element:
      id: 'profile-privacy-heading'
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: 'profile-analytics-consent'
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: 'profile-consent-history'
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: 'profile-gym-settings'
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: 'profile-your-data'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Back'

# Preferences moved behind the Settings hub (T-00.9): More → "Settings" →
# a row that opens /preferences — "more-preferences" no longer exists.
- tapOn:
    id: 'more-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-safety'
    timeout: 15000
- tapOn:
    id: 'settings-safety'
- extendedWaitUntil:
    visible:
      id: 'preferences-title'
    timeout: 15000
- assertVisible:
    id: 'preferences-safety'
- tapOn: 'Back'
# The Settings hub has no header/back button of its own (Screen is a plain
# SafeAreaView) — pop it with the OS back action (hardware back on Android,
# the interactive-pop gesture on iOS; both are enabled by default on
# expo-router's native-stack screens).
- extendedWaitUntil:
    visible:
      id: 'settings-safety'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'more-my-weeks'
    timeout: 15000

# My weeks (P2-8: saved weeks + past weeks, History folded in)
- tapOn:
    id: 'more-my-weeks'
- extendedWaitUntil:
    visible:
      id: 'my-weeks-title'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'past-weeks'
    direction: DOWN
- tapOn:
    id: 'my-weeks-back'

# Feedback card renders on the More hub
- assertVisible:
    id: 'feedback-card'

# Household (wave-2b)
- tapOn:
    id: 'more-household'
- extendedWaitUntil:
    visible:
      id: 'household-title'
    timeout: 15000
- tapOn: 'Back'
