# More-hub screens E2E — M2-7 preferences, M2-8 profile, My weeks (P2-8).
# The tracker (Today → "See full day") and the pantry (Shop → In my kitchen)
# left More in P2-2 / P2-8; dashboard.flow and shopping-list.flow cover them.
# Precondition: signed-in session (any account).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: '.*More.*'

- tapOn:
    id: 'more-profile'
- extendedWaitUntil:
    visible:
      id: 'profile-title'
    timeout: 15000
- assertVisible:
    id: 'profile-user-card'
- tapOn: 'Back'

- tapOn:
    id: 'more-preferences'
- extendedWaitUntil:
    visible:
      id: 'preferences-title'
    timeout: 15000
- assertVisible:
    id: 'preferences-safety'
- tapOn: 'Back'

# My weeks (P2-8: saved weeks + past weeks, History folded in)
- tapOn:
    id: 'more-my-weeks'
- extendedWaitUntil:
    visible:
      id: 'my-weeks-title'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'past-weeks'
    direction: DOWN
- tapOn:
    id: 'my-weeks-back'

# Feedback card renders on the More hub
- assertVisible:
    id: 'feedback-card'

# Household (wave-2b)
- tapOn:
    id: 'more-household'
- extendedWaitUntil:
    visible:
      id: 'household-title'
    timeout: 15000
- tapOn: 'Back'
