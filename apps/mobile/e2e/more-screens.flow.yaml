# More-hub screens E2E — M2-4 tracker, M2-6 pantry, M2-7 preferences,
# M2-8 profile. Precondition: signed-in session (any account).
appId: dev.chefer.app
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: '.*More.*'

- tapOn:
    id: 'more-tracker'
- extendedWaitUntil:
    visible:
      id: 'tracker-title'
    timeout: 15000
- assertVisible:
    id: 'tracker-totals'
- tapOn:
    id: 'tracker-close'

- tapOn:
    id: 'more-pantry'
- extendedWaitUntil:
    visible:
      id: 'pantry-title'
    timeout: 15000
- tapOn: 'Back'

- tapOn:
    id: 'more-profile'
- extendedWaitUntil:
    visible:
      id: 'profile-title'
    timeout: 15000
- assertVisible:
    id: 'profile-user-card'
- tapOn: 'Back'

- tapOn:
    id: 'more-preferences'
- extendedWaitUntil:
    visible:
      id: 'preferences-title'
    timeout: 15000
- assertVisible:
    id: 'preferences-safety'
- tapOn: 'Back'

# History (M2-10)
- tapOn:
    id: 'more-history'
- extendedWaitUntil:
    visible:
      id: 'history-title'
    timeout: 15000
- tapOn: 'Back'

# Feedback card renders on the More hub
- assertVisible:
    id: 'feedback-card'

# Household (wave-2b)
- tapOn:
    id: 'more-household'
- extendedWaitUntil:
    visible:
      id: 'household-title'
    timeout: 15000
- tapOn: 'Back'
