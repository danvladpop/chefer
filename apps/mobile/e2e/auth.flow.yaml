# Auth lifecycle E2E — the template flow for all Wave-2 features.
# Run:  cd apps/mobile && maestro test e2e/auth.flow.yaml
# Needs: the dev app installed on a booted simulator (pnpm mobile:ios),
#        Metro running, and the local API up (pnpm dev).
# Rate-limit budget: 1 register + 1 login per run (10/15min per IP).
appId: dev.chefer.app.dev
---
- launchApp:
    clearState: true

# clearState also wipes the dev-client's remembered Metro server — reconnect
# per platform (see common/connect.yaml for why the paths differ).
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: exp+chefer://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8083
      # iOS sometimes confirms scheme links — approve if asked.
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 5000
          optional: true
      - tapOn:
          text: 'Open'
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      - openLink: chefer-dev://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8083
      - runFlow:
          when:
            visible: 'Development Build'
          commands:
            - tapOn: 'http://.*:8083'

# Clear the first-run dev-menu chrome (cross-platform):
# iOS: Continue opens the dev menu (closed by xmark); Android: dismisses.
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- tapOn:
    id: 'xmark'
    optional: true
- runFlow:
    when:
      visible: 'Reload'
    commands:
      - back

# clearState does NOT clear SecureStore (iOS Keychain survives app-data
# wipes), so a previous session may still be live — sign out first if so.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      # Tab items expose labels like "More, tab, 5 of 5" — match loosely.
      - tapOn: 'More(, tab.*)?'
      # Sign out sits low on More — on a 16e its centre is under the tab bar.
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
          centerElement: true
      - tapOn:
          id: 'logout-button'

# ── UX-25 (T-25.1): a device that has NEVER signed in lands on Welcome, not
# Sign in — `hasSignedInBefore` lives in SecureStore, so this only shows on a
# device/simulator that has never completed a sign-in before. A run after a
# previous one on the same simulator sees `login-title` directly instead
# (never cleared by sign-out) — either way the flow converges on Sign in
# below. Navigate via "I already have an account" rather than "Create free
# account" so the rest of the flow (which starts from Sign in) is unchanged.
- extendedWaitUntil:
    visible:
      id: 'welcome-title'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-title'
    commands:
      - assertNotVisible: 'Welcome back'
      - tapOn:
          id: 'welcome-sign-in'

# ── Register a throwaway account ──────────────────────────────────────────────
- evalScript: ${output.email = 'maestro-' + Date.now() + '@e2e.chefer.dev'}
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000

# ── Forgot password is reachable and returns to sign in (F-M-AUTH-3-1) ──────
# (Doesn't submit: requestPasswordReset is rate-limited 5/15min per IP.)
- tapOn:
    id: 'login-forgot-password'
- assertVisible:
    id: 'forgot-password-title'
- tapOn:
    id: 'forgot-password-to-login'
- assertVisible:
    id: 'login-title'

- tapOn:
    id: 'login-to-register'
- assertVisible:
    id: 'register-title'
- tapOn:
    id: 'register-email'
- inputText: ${output.email}
- tapOn:
    id: 'register-password'
- inputText: 'Maestro@123!'
- tapOn:
    id: 'register-confirm-password'
- inputText: 'Maestro@123!'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# ── T-39.1 / T-26.5: both consent boxes — required before the submit reaches
# the API (the button itself stays enabled; an unticked box would show an
# inline error instead of registering).
- tapOn:
    id: 'register-accept-terms'
- tapOn:
    id: 'register-age-confirm'
- tapOn:
    id: 'register-submit'
    optional: true
# iOS may offer to save the password — decline so it never blocks.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true

# ── A fresh account lands in onboarding first (dogfood feedback #9) ─────────
# — skip it, since this flow only cares about the auth lifecycle.
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
- tapOn:
    id: 'onboarding-skip'

# ── Registration (via onboarding) lands on the Home tab ─────────────────────
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000
# Below the fold on smaller phones once Today has more cards above it.
- scrollUntilVisible:
    element:
      id: 'week-outlook'
    direction: DOWN
    visibilityPercentage: 50

# ── Sign out from the More tab ───────────────────────────────────────────────
- tapOn: 'More(, tab.*)?'
# Sign out sits low on More — on a 16e its centre is under the tab bar.
- scrollUntilVisible:
    element:
      id: 'logout-button'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 10000

# ── Sign back in with the same account ───────────────────────────────────────
- tapOn:
    id: 'login-email'
- inputText: ${output.email}
- tapOn:
    id: 'login-password'
- inputText: 'Maestro@123!'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
# iOS may offer to save the password — decline so it never blocks.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000

# ── Teardown: sign out so the next flows sign in as alice (connect.yaml) ────
# UX-25 (T-25.1, AC2): this device HAS signed in now, so Sign in reads
# "Welcome back" — never the first-timer "Sign in" title, regardless of
# whether Welcome showed at the top of this run.
- tapOn: 'More(, tab.*)?'
# Sign out sits low on More — on a 16e its centre is under the tab bar.
- scrollUntilVisible:
    element:
      id: 'logout-button'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 15000
- assertVisible: 'Welcome back'
