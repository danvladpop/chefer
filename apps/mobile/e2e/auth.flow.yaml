# Auth lifecycle E2E — the template flow for all Wave-2 features.
# Run:  cd apps/mobile && maestro test e2e/auth.flow.yaml
# Needs: the dev app installed on a booted simulator (pnpm mobile:ios),
#        Metro running, and the local API up (pnpm dev).
# Rate-limit budget: 1 register + 1 login per run (10/15min per IP).
appId: dev.chefer.app
---
- launchApp:
    clearState: true

# clearState also wipes the dev-client's remembered Metro server, dropping it
# on the server-picker screen — deep-link it straight back to our bundler.
- openLink: exp+chefer://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8083

# The dev client shows its first-run "developer menu" explainer after a state
# clear — close it via the sheet's X (tapping "Continue" opens the dev menu
# instead of dismissing).
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn:
          point: 90%,47%

# clearState does NOT clear SecureStore (iOS Keychain survives app-data
# wipes), so a previous session may still be live — sign out first if so.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      # Tab items expose labels like "More, tab, 5 of 5" — match loosely.
      - tapOn: '.*More.*'
      - tapOn:
          id: 'logout-button'

# ── Register a throwaway account ──────────────────────────────────────────────
- evalScript: ${output.email = 'maestro-' + Date.now() + '@e2e.chefer.dev'}
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-to-register'
- assertVisible:
    id: 'register-title'
- tapOn:
    id: 'register-email'
- inputText: ${output.email}
- tapOn:
    id: 'register-password'
- inputText: 'Maestro@123!'
- tapOn:
    id: 'register-submit'
# iOS may offer to save the password — decline so it never blocks.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true

# ── Registration lands on the Home tab ───────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000
- assertVisible:
    id: 'week-outlook'

# ── Sign out from the More tab ───────────────────────────────────────────────
- tapOn: '.*More.*'
- tapOn:
    id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 10000

# ── Sign back in with the same account ───────────────────────────────────────
- tapOn:
    id: 'login-email'
- inputText: ${output.email}
- tapOn:
    id: 'login-password'
- inputText: 'Maestro@123!'
- tapOn:
    id: 'login-submit'
# iOS may offer to save the password — decline so it never blocks.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000
