# Today tab (was Home) E2E — M2-1, P2-2.
# Precondition: a signed-in session on the device (run auth.flow.yaml first;
# it ends signed in). Asserts the dashboard's cards render against live data.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
# B-31 interim (T-00.12, UX-04 AC4): the ring, weight card and profile nudge
# render only when the account has a goal or tracks (≥ 3 of the last 7 days).
# The seeded alice has neither, but a dev DB may have given her a goal — check
# whichever branch applies instead of assuming one.
- runFlow:
    when:
      visible:
        id: 'nutrition-summary'
    commands:
      - assertVisible:
          id: 'nutrition-status'
- runFlow:
    when:
      notVisible:
        id: 'nutrition-summary'
    commands:
      - assertNotVisible:
          id: 'calorie-ring'
      - assertNotVisible:
          id: 'profile-nudge'
# Quick add stays available to everyone.
- assertVisible:
    id: 'today-quick-add'

# "See full day" opens the full tracker (it left More, F-PM-7)
- tapOn:
    id: 'today-full-day'
- extendedWaitUntil:
    visible:
      id: 'tracker-title'
    timeout: 15000
- tapOn:
    id: 'tracker-close'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000

# The week outlook moved below the next meal
- scrollUntilVisible:
    element:
      id: 'week-outlook'
    direction: DOWN

# Day panel toggles open and closed
- tapOn:
    id: 'day-chip-0'
- tapOn:
    id: 'day-chip-0'

# UX-04 §3, T-04.4: the card stack's hero is exactly one of hero-meal-card
# (next-up, morning/daytime), tonight-card (evening, dinner planned),
# tonight-card-done (dinner already logged), nothing-tonight-card (evening,
# no dinner planned) or tomorrow-card (late evening) — never more than one.
- runFlow:
    when:
      visible:
        id: 'tonight-card'
    commands:
      - assertVisible:
          id: 'tonight-cook-it'
      - assertVisible:
          id: 'tonight-swap'
- runFlow:
    when:
      visible:
        id: 'tomorrow-card'
    commands:
      - assertVisible:
          id: 'tomorrow-view-recipe'

# Shop-due card (T-04.2/T-04.4): only when something's due for tomorrow.
- runFlow:
    when:
      visible:
        id: 'shop-due-card'
    commands:
      - tapOn:
          id: 'shop-due-card'
      - extendedWaitUntil:
          visible:
            id: 'shopping-title'
          timeout: 15000
      - back
      - extendedWaitUntil:
          visible:
            id: 'home-title'
          timeout: 15000

# T-35.5: the ring's target-mode label, only alongside the ring itself.
- runFlow:
    when:
      visible:
        id: 'nutrition-summary'
    commands:
      - runFlow:
          when:
            visible:
              id: 'target-mode-label'
          commands:
            - assertVisible:
                id: 'target-mode-label'
