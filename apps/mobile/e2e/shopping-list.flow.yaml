# Shopping list E2E — M2-5. Precondition: signed-in session (run auth.flow first).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: '.*Shop.*'
- extendedWaitUntil:
    visible:
      id: 'shopping-title'
    timeout: 15000
# Either a list with categories or the no-plan empty state must render
- runFlow:
    when:
      notVisible:
        id: 'shopping-empty'
    commands:
      - assertVisible:
          id: 'add-item-input'

# UX-13 (T-13.2): the header share button exists once there is a list. The
# sheet and text builder are covered by Jest; the OS share sheet is never opened.
- runFlow:
    when:
      notVisible:
        id: 'shopping-empty'
    commands:
      - assertVisible:
          id: 'share-list'

# Bug B-28 regression: ticking an item must not make the category header or
# a sibling item disappear/jump out of reach (the header's own label text
# used to be able to wrap and reflow everything below it on every tick —
# see category-header.tsx). Expand the first category, tick its first item,
# confirm the header and item are still there, then untick to leave the list
# unchanged for the rest of the flow.
- runFlow:
    when:
      notVisible:
        id: 'shopping-empty'
    commands:
      - tapOn:
          id: 'category-.*'
          index: 0
      - tapOn:
          id: 'item-.*'
          index: 0
      - assertVisible:
          id: 'category-.*'
          index: 0
      - assertVisible:
          id: 'item-.*'
          index: 0
      - tapOn:
          id: 'item-.*'
          index: 0

# FB7-10: the list says where it comes from (the pantry segment is retired)
- scrollUntilVisible:
    element:
      id: 'shopping-provenance'
    direction: UP
- assertVisible:
    id: 'shopping-provenance'
