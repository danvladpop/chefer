# Shopping list E2E — M2-5. Precondition: signed-in session (run auth.flow first).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: '.*Shop.*'
- extendedWaitUntil:
    visible:
      id: 'shopping-title'
    timeout: 15000
# Either a list with categories or the no-plan empty state must render
- runFlow:
    when:
      notVisible:
        id: 'shopping-empty'
    commands:
      - assertVisible:
          id: 'add-item-input'

# Shop = To buy / In my kitchen (P2-8): the pantry moved here from More
- scrollUntilVisible:
    element:
      id: 'shop-segment-kitchen'
    direction: UP
- tapOn:
    id: 'shop-segment-kitchen'
- extendedWaitUntil:
    visible:
      id: 'shopping-title'
    timeout: 15000
- tapOn:
    id: 'shop-segment-list'
