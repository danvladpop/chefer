# AI chef chat E2E — M2-9. UI-only: never sends a message (dev API runs real
# Gemini; sends cost money and chat quota). The streaming path itself is
# covered by the gated contract test (CHEFER_CONTRACT_AI=1).
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
- tapOn: 'More(, tab.*)?'
- tapOn:
    id: 'more-ai chef'
- extendedWaitUntil:
    visible:
      id: 'chat-title'
    timeout: 15000
# UX-22 (T-22.2, AC2/AC5): the disclaimer subtitle is always visible under
# the title, and the empty thread shows the chef-not-a-doctor line — neither
# needs a message sent, so both are covered without touching the AI quota.
- assertVisible:
    id: 'chat-header-subtitle'
- assertVisible:
    id: 'chat-empty'
- assertVisible:
    id: 'chat-empty-disclaimer'
- assertVisible:
    id: 'chat-input'
- tapOn: 'Back'
