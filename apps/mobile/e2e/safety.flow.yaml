# Safety filter E2E (T-01.7/T-02.2/T-02.3/T-02.5/T-01.5) — UX-01/UX-02. Signs in
# as the seeded alice account; costs 1 login of the 10/15min per-IP budget.
# Android: scrollUntilVisible before assertions under the fold.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml

# Whoever is signed in, sign out — the flow needs a known-clean allergy state.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      - tapOn: 'More(, .*)?'
      # Sign out sits low on More — on a 16e its centre is under the tab bar.
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
          centerElement: true
      - tapOn:
          id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 15000
- tapOn:
    id: 'login-email'
- inputText: 'alice@chefer.dev'
- tapOn:
    id: 'login-password'
- inputText: 'User@123!'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000

# ── T-01.7: SafetyPicker — set Tree nuts, see the read-back within 150ms (AC1) ──
- tapOn: 'More(, .*)?'
- tapOn:
    id: 'more-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-safety'
    timeout: 15000
- tapOn:
    id: 'settings-safety'
- extendedWaitUntil:
    visible:
      id: 'preferences-safety'
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: 'Tree nuts'
- tapOn: 'Tree nuts'
- assertVisible:
    id: 'prefs-allergies-readback'
- assertVisible: '.*granola.*'
# Save the allergy, then leave the pushed Settings › Food safety screens so
# the tab bar is reachable again.
- scrollUntilVisible:
    element:
      id: 'prefs-save-safety'
- tapOn:
    id: 'prefs-save-safety'
# UX-26 (T-26.2): the first allergy save asks for health-information consent
# (alice has none on a fresh DB) — allow it; a no-op when already given.
- extendedWaitUntil:
    visible:
      id: 'health-consent-allow'
    timeout: 3000
    optional: true
- tapOn:
    id: 'health-consent-allow'
    optional: true
- tapOn:
    text: 'Back'
    optional: true
# Settings' own back control has no text label — edge-swipe back to More.
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 400

# ── T-02.5: Discover says what it filtered (AC7) ──
- tapOn:
    id: 'tab-food'
    optional: true
- tapOn: '.*Cookbook.*'
- extendedWaitUntil:
    visible:
      id: 'recipes-title'
    timeout: 15000
- tapOn: 'Discover'
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: 'discover-filtered-for'
- extendedWaitUntil:
    visible:
      id: 'discover-filtered-for'
    timeout: 15000
- assertVisible: '.*hidden.*'
- tapOn:
    id: 'discover-filtered-for'
- extendedWaitUntil:
    visible:
      id: 'what-we-check-sheet-title'
    timeout: 10000
- tapOn:
    id: 'what-we-check-sheet-close'

# ── T-02.3: recipe detail Checked line (AC1/AC3) + T-01.5 report (AC10) ──
- tapOn:
    id: 'recipe-card-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
# Discover already filtered this recipe, so it either shows Checked or (own
# recipe edge cases aside) never a conflict banner here.
- runFlow:
    when:
      visible:
        id: 'recipe-checked-for'
    commands:
      - tapOn:
          id: 'recipe-checked-for'
      - extendedWaitUntil:
          visible:
            id: 'what-we-check-sheet-title'
          timeout: 10000
      - tapOn:
          id: 'what-we-check-sheet-close'
- tapOn:
    id: 'recipe-report-overflow'
- extendedWaitUntil:
    visible:
      id: 'report-safety-sheet-title'
    timeout: 10000
- tapOn: 'It contains something we can’t eat'
- tapOn:
    id: 'report-safety-send'
- extendedWaitUntil:
    visible: '.*Thanks.*'
    timeout: 10000

# ── T-02.4/T-02.5/T-01.5 (L-SAFE2, wave 2): Plan tab week card, Replace
# picker's Filtered-for line, and the plan-card long-press report ──
# Leave the recipe detail pushed above the tabs first.
- tapOn:
    text: 'Back'
    optional: true
- waitForAnimationToEnd
- tapOn: 'Plan(, tab.*)?'
- extendedWaitUntil:
    visible:
      id: 'plan-week-label'
    timeout: 5000
    optional: true
# A tab tap during the Back transition can be dropped — retry once.
- runFlow:
    when:
      notVisible:
        id: 'plan-week-label'
    commands:
      - tapOn: 'Plan(, tab.*)?'
- extendedWaitUntil:
    visible:
      id: 'plan-week-label'
    timeout: 15000
# A fresh account has no week yet — plan one (premium asks for AI consent
# first; Allow continues).
- runFlow:
    when:
      visible:
        id: 'plan-empty'
    commands:
      - tapOn:
          id: 'plan-generate'
      - extendedWaitUntil:
          visible:
            id: 'ai-consent-allow'
          timeout: 5000
          optional: true
      - tapOn:
          id: 'ai-consent-allow'
          optional: true
      - extendedWaitUntil:
          notVisible:
            id: 'plan-empty'
          timeout: 60000
- runFlow:
    when:
      notVisible:
        id: 'plan-empty'
    commands:
      # Tree nuts was set above (T-01.7) — the table has rules, so the week
      # card shows the exact copy string verbatim (AC1).
      - assertVisible:
          id: 'plan-week-safety'
      - assertVisible: '.*Checked for your table.*'
      - tapOn:
          id: 'plan-day-0'
      # Replace picker: a tree-nut table hides some curated recipes for at
      # least one slot — assert the Filtered-for line whenever this
      # particular slot's search actually hid something (pool content varies
      # by meal type/day, so this stays optional rather than flaking).
      - tapOn:
          id: 'plan-meal-swap-.*'
          index: 0
          optional: true
      - runFlow:
          when:
            visible:
              id: 'picker-search'
          commands:
            - runFlow:
                when:
                  visible:
                    id: 'picker-filtered-for'
                commands:
                  - assertVisible: '.*hidden.*'
            - tapOn:
                id: 'picker-close'
            - extendedWaitUntil:
                notVisible:
                  id: 'picker-search'
                timeout: 5000
      # T-01.5: long-press a plan meal card opens the SAME report sheet as
      # the recipe-detail overflow action (onLongPress never also navigates
      # to the recipe — onPress and onLongPress are mutually exclusive).
      - longPressOn:
          id: 'plan-meal-(breakfast|lunch|dinner|snack)'
          index: 0
      - extendedWaitUntil:
          visible:
            id: 'report-safety-sheet-title'
          timeout: 10000
      - tapOn: 'Something else'
      - tapOn:
          id: 'report-safety-send'
      - extendedWaitUntil:
          visible: '.*Thanks.*'
          timeout: 10000
