# Trainer mode, M3: bookings (docs/prd-2026-10/trainer-mode.md §6.2, §6.3, §6.9, §14 "booking create →
# client sees the card (two accounts)"). A `runScript` setup registers a trainer (tools on, gym line
# "Iron Gym, Cluj") with two active clients who have gym setup done. The flow signs in as the trainer,
# switches to trainer mode, opens Schedule → + (the editor starts on today's next full hour) → ticks both
# clients → Save; the block appears ("… Mx… + 1") → booking detail lists both clients. Then it switches
# back to personal mode, signs out, signs in as client 1 and finds the upcoming-booking card on Today
# ("Session with Ana… · Iron Gym, Cluj · with 1 other").
#
# Needs: the dev app on a booted simulator/emulator, Metro up, the local API up with
# FEATURE_FLAGS=coaching,trainerMode,mobileShellV2 TRAINER_ALLOWLIST=* — pass
# `-e API_URL=http://localhost:<port>` when the API is not on :3001. Costs 3 registers + 2 logins of the
# per-IP auth budget. Run it before 23:00 local time (+ starts on the next full hour of today). Local only.
appId: dev.chefer.app.dev
env:
  API_URL: http://localhost:3001
---
- runScript: scripts/trainer-bookings-setup.js
- runFlow: common/connect.yaml

# A device left in trainer mode (an earlier run that stopped half-way) reopens there: back to personal first.
- extendedWaitUntil:
    visible:
      id: 'trainer-today'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trainer-today'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: 'trainer-tab-you'
          retryTapIfNoChange: true
      - tapOn:
          id: 'trainer-you-switch-to-personal'

# ── Whoever is signed in, sign out (new shell: You → Sign out) ───────────────
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'today-scroll'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: 'tab-you'
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
      - tapOn:
          id: 'logout-button'
      - tapOn:
          id: 'you-sign-out-confirm-confirm'
- extendedWaitUntil:
    visible:
      id: 'welcome-title'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-title'
    commands:
      - tapOn:
          id: 'welcome-sign-in'

# ── Sign in as the trainer ───────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-email'
- inputText: ${output.tEmail}
- tapOn:
    id: 'login-password'
- inputText: ${output.tPassword}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
    optional: true
- tapOn:
    id: 'onboarding-skip'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 20000

# ── Personal You → Switch to trainer mode ────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'tab-you'
- extendedWaitUntil:
    visible:
      id: 'you-switch-to-trainer'
    timeout: 20000
- tapOn:
    id: 'you-switch-to-trainer'
- extendedWaitUntil:
    visible:
      id: 'trainer-today'
    timeout: 15000

# ── Schedule → + → a booking with both clients today ─────────────────────────
# The mode switch cross-fades the shells (MO-09): a tab tap during the fade lands nowhere (Android).
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'trainer-tab-schedule'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'trainer-schedule'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'schedule-day-grid'
    timeout: 15000
- takeScreenshot: trainer-bookings-schedule-empty
- tapOn:
    id: 'schedule-add'
- extendedWaitUntil:
    visible:
      id: 'booking-editor-client-${output.c1Id}'
    timeout: 15000
- tapOn:
    id: 'booking-editor-client-${output.c1Id}'
- tapOn:
    id: 'booking-editor-client-${output.c2Id}'
- takeScreenshot: trainer-bookings-editor
- tapOn:
    id: 'booking-editor-save'
- extendedWaitUntil:
    notVisible:
      id: 'booking-editor-title'
    timeout: 15000

# ── The block is on today's grid; its detail lists both clients ─────────────
# A block is one button whose label is the whole line: "Tuesday 19:00 to 20:00, Mxabc + 1".
- scrollUntilVisible:
    element: '.*day [0-9]{2}:[0-9]{2} to [0-9]{2}:[0-9]{2}, Mx[a-z]+ [+] 1.*'
    direction: DOWN
    timeout: 20000
- takeScreenshot: trainer-bookings-schedule-block
- tapOn: '.*day [0-9]{2}:[0-9]{2} to [0-9]{2}:[0-9]{2}, Mx[a-z]+ [+] 1.*'
- extendedWaitUntil:
    visible:
      id: 'booking-detail'
    timeout: 15000
- assertVisible:
    id: 'booking-client-${output.c1Id}'
- assertVisible:
    id: 'booking-client-${output.c2Id}'
- assertVisible:
    id: 'booking-detail-location'
    text: 'Iron Gym, Cluj'
- takeScreenshot: trainer-bookings-detail

# ── Back to personal mode, sign out ─────────────────────────────────────────
- tapOn:
    id: 'booking-detail-header-back'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'trainer-tab-you'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'trainer-you-switch-to-personal'
    timeout: 10000
- tapOn:
    id: 'trainer-you-switch-to-personal'
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'tab-you'
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: 'logout-button'
    direction: DOWN
- tapOn:
    id: 'logout-button'
- tapOn:
    id: 'you-sign-out-confirm-confirm'
- extendedWaitUntil:
    visible:
      id: 'welcome-title'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-title'
    commands:
      - tapOn:
          id: 'welcome-sign-in'

# ── Client 1 signs in: the upcoming-booking card on Today ────────────────────
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-email'
- inputText: ${output.c1Email}
- tapOn:
    id: 'login-password'
- inputText: ${output.c1Password}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
    optional: true
- tapOn:
    id: 'onboarding-skip'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 20000
# The first booking card asks once for notification permission (booking reminders, §7.3).
- extendedWaitUntil:
    visible: 'Allow'
    timeout: 8000
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- scrollUntilVisible:
    element:
      id: 'coaching-upcoming-booking'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'coaching-upcoming-booking-text'
    text: 'Session with .* · Today [0-9]{2}:[0-9]{2} · Iron Gym, Cluj · with 1 other'
- takeScreenshot: trainer-bookings-client-card
- tapOn:
    id: 'coaching-upcoming-booking'
- extendedWaitUntil:
    visible:
      id: 'client-booking'
    timeout: 15000
- assertVisible:
    id: 'client-booking-location'
- takeScreenshot: trainer-bookings-client-detail
