# Trainer mode, M3: coach a group booking (docs/prd-2026-10/trainer-mode.md §6.7, §14). A `runScript`
# setup registers a trainer (tools on) with two active clients who have gym setup done, and books one
# group booking with both, starting in 5–10 minutes. The flow signs in as the trainer, switches to
# trainer mode, presses Start on Today → the coached logger opens with both clients' chips → logs one
# set for client 1 → switches → logs one set for client 2 → Finish → "Finish everyone" → lands on the
# booking detail, where both clients read Attended and "Logged by you" once the sync lands. Ends by
# switching back to personal mode.
#
# OFFLINE: not covered here. Maestro's `setAirplaneMode` works on Android only (the iOS simulator has
# no airplane mode to toggle), so a cross-platform offline variant is not feasible. The offline path —
# start from the prescriptions kept when Today loaded, queue per client, flush via trainer.coach.sync on
# reconnect — is covered by Jest (trainer-coach-workouts.test.ts, trainer-coach-screen.test.tsx).
#
# Needs: the dev app on a booted simulator/emulator, Metro up, the local API up with
# FEATURE_FLAGS=coaching,trainerMode,mobileShellV2 TRAINER_ALLOWLIST=* — pass
# `-e API_URL=http://localhost:<port>` when the API is not on :3001. Costs 3 registers + 1 login of the
# per-IP auth budget. Local only (the orchestrator runs it).
appId: dev.chefer.app.dev
env:
  API_URL: http://localhost:3001
---
- runScript: scripts/trainer-coach-setup.js
- runFlow: common/connect.yaml

# A device left in trainer mode (an earlier run that stopped half-way) reopens there: back to personal first.
- extendedWaitUntil:
    visible:
      id: 'trainer-today'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'trainer-today'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: 'trainer-tab-you'
          retryTapIfNoChange: true
      - tapOn:
          id: 'trainer-you-switch-to-personal'

# ── Whoever is signed in, sign out (new shell: You → Sign out) ───────────────
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'today-scroll'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: 'tab-you'
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
      - tapOn:
          id: 'logout-button'
      - tapOn:
          id: 'you-sign-out-confirm-confirm'
- extendedWaitUntil:
    visible:
      id: 'welcome-title'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome-title'
    commands:
      - tapOn:
          id: 'welcome-sign-in'

# ── Sign in as the trainer ───────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-email'
- inputText: ${output.tEmail}
- tapOn:
    id: 'login-password'
- inputText: ${output.tPassword}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
    optional: true
- tapOn:
    id: 'onboarding-skip'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 20000

# ── Personal You → Switch to trainer mode ────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'tab-you'
- extendedWaitUntil:
    visible:
      id: 'you-switch-to-trainer'
    timeout: 20000
- tapOn:
    id: 'you-switch-to-trainer'
- extendedWaitUntil:
    visible:
      id: 'trainer-today'
    timeout: 15000

# ── Today: the group booking → Start ─────────────────────────────────────────
# The mode switch cross-fades the shells (MO-09): wait for it before tapping.
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'trainer-today-start'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'trainer-today-start'
    retryTapIfNoChange: true

# ── The coached logger: both clients, one set each ──────────────────────────
- extendedWaitUntil:
    visible:
      id: 'coach-switcher'
    timeout: 20000
- assertVisible:
    id: 'coach-client-0'
- assertVisible:
    id: 'coach-client-1'
- takeScreenshot: trainer-coach-group
# Client 1 (selected first): tick the first working set as prescribed.
- tapOn:
    id: 'exercise-0-set-1-check'
# Switch to client 2: their own workout, nothing ticked yet.
- tapOn:
    id: 'coach-client-1'
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'exercise-0-set-1-check'
# Back to client 1: the tick was kept.
- tapOn:
    id: 'coach-client-0'
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: trainer-coach-switch-kept

# ── Finish everyone → the booking detail ────────────────────────────────────
- tapOn:
    id: 'workout-finish'
- extendedWaitUntil:
    visible:
      id: 'coach-finish-all'
    timeout: 5000
- assertVisible:
    id: 'coach-finish-this'
- tapOn:
    id: 'coach-finish-all'
- extendedWaitUntil:
    visible:
      id: 'booking-detail'
    timeout: 15000
# Attendance is marked by the server when trainer.coach.sync lands (online: right away).
- extendedWaitUntil:
    visible:
      id: 'booking-client-${output.c1Id}-logged'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'booking-client-${output.c2Id}-logged'
    timeout: 20000
- assertVisible:
    id: 'booking-client-${output.c1Id}-attended'
    selected: true
- assertVisible:
    id: 'booking-client-${output.c2Id}-attended'
    selected: true
- takeScreenshot: trainer-coach-attended

# ── Leave the device in personal mode for the next flow ─────────────────────
- tapOn:
    id: 'booking-detail-header-back'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'trainer-tab-you'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'trainer-you-switch-to-personal'
    timeout: 10000
- tapOn:
    id: 'trainer-you-switch-to-personal'
- extendedWaitUntil:
    visible:
      id: 'today-scroll'
    timeout: 15000
