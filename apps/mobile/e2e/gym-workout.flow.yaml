# Active workout → summary E2E — G2-A (gym_plan.md §1.3).
# Preconditions: signed-in session (connect.yaml signs in as alice if needed)
# and a gym profile with an active routine (run gym-setup.flow.yaml first on a
# fresh account). Today's "Start workout" / "Resume" testIDs come from G2-B.
# Checks: start from Today → tick a working set (rest starts → the B-40
# rest-permission rationale sheet, T-36.2) → remove + Undo a set → Save for
# later → Resume card (paused) → Resume → tick the rest of the first
# exercise → answer the RIR chip → Finish with other exercises never started
# (the T-36.3 "N exercises not started" sheet, carrying them to next time by
# default) → the summary shows the "Next time" decisions.
# Ends in FOOD mode so the food flows are unaffected.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000

# ── Food → Gym Today ──────────────────────────────────────────────────────────
- tapOn:
    id: 'mode-switch-gym'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000

# A workout left running by an earlier (failed) run is discarded first, so
# every run starts from a fresh session with exercise 0 in view.
- runFlow:
    when:
      visible:
        id: 'gym-today-resume'
    commands:
      - tapOn:
          id: 'gym-today-resume-button'
      - extendedWaitUntil:
          visible:
            id: 'workout-title'
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: 'workout-discard'
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: 'workout-discard'
      - tapOn:
          id: 'workout-discard-sheet-confirm'
      - extendedWaitUntil:
          visible:
            id: 'gym-today-title'
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'gym-today-start'
    timeout: 15000
- tapOn:
    id: 'gym-today-start'
- extendedWaitUntil:
    visible:
      id: 'workout-title'
    timeout: 15000
- assertVisible:
    id: 'workout-finish'
- assertVisible:
    id: 'exercise-0-suggestion'

# ── Tick every working set of the first exercise ─────────────────────────────
# Skipping the rest after each tick keeps the sticky timer bar from covering
# the next ✓. Routines have 2–5 working sets; the later ones are optional.
- tapOn:
    id: 'exercise-0-set-1-check'
- assertVisible:
    id: 'rest-timer-remaining'
# B-40 (T-36.2): the first rest ever started on this device shows the
# rest-timer permission rationale sheet in front of the timer bar — never a
# cold OS prompt at workout start. Accept it, then the OS dialog it triggers.
- extendedWaitUntil:
    visible:
      id: 'gym-rest-permission-allow'
    timeout: 5000
    optional: true
- tapOn:
    id: 'gym-rest-permission-allow'
    optional: true
- extendedWaitUntil:
    visible: 'Allow'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    id: 'rest-timer-skip'

# ── Remove a set via its ⋯, then Undo (UX-05 A1, T-05.A1.2, PAT-16) ──────────
# No confirm dialog: the row leaves immediately and a snackbar offers Undo.
- tapOn:
    id: 'exercise-0-set-2-menu'
- assertVisible:
    id: 'snackbar-message'
- assertVisible:
    id: 'snackbar-action'
- tapOn:
    id: 'snackbar-action'
- assertNotVisible:
    id: 'snackbar-message'
- assertVisible:
    id: 'exercise-0-set-2-check'

# ── Save for later → Resume card → Resume (UX-36 (3), T-36.3) ────────────────
# One set logged so far. Saving for later must not lose it: back on Today the
# Resume card shows its paused variant ("Keeps until …"), and Resume reopens
# this exact session with set 1 still ticked.
- scrollUntilVisible:
    element:
      id: 'workout-save-for-later'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'workout-save-for-later'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000
- assertVisible:
    id: 'gym-today-resume'
- assertVisible:
    id: 'gym-today-resume-keeps-until'
- tapOn:
    id: 'gym-today-resume-button'
- extendedWaitUntil:
    visible:
      id: 'workout-title'
    timeout: 15000
- assertVisible:
    id: 'exercise-0-set-1-check'

- tapOn:
    id: 'exercise-0-set-2-check'
- tapOn:
    id: 'rest-timer-skip'
    optional: true
- tapOn:
    id: 'exercise-0-set-3-check'
    optional: true
- tapOn:
    id: 'rest-timer-skip'
    optional: true
- tapOn:
    id: 'exercise-0-set-4-check'
    optional: true
- tapOn:
    id: 'rest-timer-skip'
    optional: true
- tapOn:
    id: 'exercise-0-set-5-check'
    optional: true
- tapOn:
    id: 'rest-timer-skip'
    optional: true

# ── RIR chip (appears after the last working set) ────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'exercise-0-rir-2'
    timeout: 5000
- tapOn:
    id: 'exercise-0-rir-2'
# Answering collapses the question.
- assertNotVisible:
    id: 'exercise-0-rir-0'

# ── Finish (other exercises are unticked → confirmation sheet) ───────────────
# The list-end Finish (the header one sits under the dev-build Tools bubble).
# Other exercises were never started, so this is the richer T-36.3 sheet:
# "N exercises not started" + a "Move them to your next session" switch,
# on by default — leave it on and confirm, carrying them to next time.
- scrollUntilVisible:
    element:
      id: 'workout-finish-bottom'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'workout-finish-bottom'
- extendedWaitUntil:
    visible:
      id: 'workout-finish-sheet-confirm'
    timeout: 5000
    optional: true
- assertVisible:
    id: 'workout-finish-sheet-option-0-switch'
    optional: true
- tapOn:
    id: 'workout-finish-sheet-confirm'
    optional: true

# ── Summary ───────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'summary-title'
    timeout: 15000
- assertVisible:
    id: 'summary-sets'
- assertVisible:
    id: 'summary-next-time'
- assertVisible:
    id: 'summary-next-0-direction'
- assertVisible:
    id: 'summary-next-0-reason'
- tapOn:
    id: 'summary-done'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000

# ── Back to Food mode ─────────────────────────────────────────────────────────
- tapOn:
    id: 'mode-switch-food'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
