# Routine tab + editor E2E — G2-C (gym_plan.md §1.3 "Routine tab" / §5.4).
# Precondition: a signed-in session with an ACTIVE routine that has at least
# one day with at least one exercise (Setup or a seeded fixture must have run
# first — this flow does not create a routine). Opens the Routine tab, edits
# the first exercise's sets, saves, and confirms the new value shows back on
# the Routine tab.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000

# ── Food → Gym, land on Today ──────────────────────────────────────────────
- tapOn:
    id: 'mode-switch-gym'
- extendedWaitUntil:
    visible:
      id: 'gym-setup-title'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: 'gym-setup-title'
    commands:
      - tapOn:
          id: 'gym-setup-title-back'
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 15000

# ── Routine tab ──────────────────────────────────────────────────────────────
- tapOn: 'Routine(, tab.*)?'
- extendedWaitUntil:
    visible:
      id: 'gym-routine-title'
    timeout: 10000
- assertVisible:
    id: 'gym-routine-name'
- assertVisible:
    id: 'gym-routine-edit'

# ── Edit ───────────────────────────────────────────────────────────────────
- tapOn:
    id: 'gym-routine-edit'
- extendedWaitUntil:
    visible:
      id: 'gym-routine-editor-title'
    timeout: 10000

# Capture the first exercise's current set count, bump it, and remember the
# expected value (ids are server-assigned, so the row testIDs are matched by
# pattern rather than by a fixed id).
- copyTextFrom:
    id: '.*-sets-value$'
- evalScript: ${output.expectedSets = Number(maestro.copiedText) + 1}
- tapOn:
    id: '.*-sets-inc$'
- assertVisible:
    id: '.*-sets-value$'
    text: '${output.expectedSets}'

# ── Save ─────────────────────────────────────────────────────────────────────
- tapOn:
    id: 'gym-routine-editor-save'
- extendedWaitUntil:
    notVisible:
      id: 'gym-routine-editor-conflict-title'
    timeout: 10000

# Leaving right after a successful save must NOT show the discard-changes
# prompt (the draft is clean again).
- tapOn:
    id: 'gym-routine-editor-title-back'
- extendedWaitUntil:
    visible:
      id: 'gym-routine-title'
    timeout: 10000
- assertNotVisible:
    text: 'Discard changes?'

# ── The new value shows back on the Routine tab ─────────────────────────────
- assertVisible:
    id: 'routine-exercise-.*'
    text: '${output.expectedSets} ×.*'

# ── Back to Food, so other flows start clean ────────────────────────────────
- tapOn:
    id: 'mode-switch-food'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
