# Gym setup E2E — G2-B (gym_plan.md §1.3 "Setup" + "Today tab").
# Run:  cd apps/mobile && maestro test e2e/gym-setup.flow.yaml
# Needs: the dev app installed on a booted simulator (pnpm mobile:ios),
#        Metro running, and the local API up (pnpm dev).
# A fresh throwaway account (never completed gym setup) registers, switches to
# Gym, walks the 7-step wizard, and lands on Today with a next-up workout.
# Rate-limit budget: 1 register per run (10/15min per IP); gym.completeSetup
# has its own 20/hour budget, well clear of a single run.
appId: dev.chefer.app.dev
---
- runFlow: common/launch.yaml

# A previous (failed) flow may have left the app in Gym mode — go to Food so
# the sign-out below can find the More tab.
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: 'gym-today-title'
    commands:
      - tapOn:
          id: 'mode-switch-food'

# clearState does NOT clear SecureStore, so a previous session may still be
# live — sign out first if so, same as auth.flow.yaml.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      - tapOn: '.*More.*'
      - tapOn:
          id: 'logout-button'

# ── Register a throwaway account ──────────────────────────────────────────────
- evalScript: ${output.email = 'maestro-gym-' + Date.now() + '@e2e.chefer.dev'}
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 30000
- tapOn:
    id: 'login-to-register'
- assertVisible:
    id: 'register-title'
- tapOn:
    id: 'register-email'
- inputText: ${output.email}
- tapOn:
    id: 'register-password'
- inputText: 'Maestro@123!'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'register-submit'
    optional: true
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true

# ── A fresh account lands in onboarding first (dogfood feedback #9) ─────────
# — skip it before switching to Gym.
- extendedWaitUntil:
    visible:
      id: 'onboarding-skip'
    timeout: 15000
- tapOn:
    id: 'onboarding-skip'

- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000

# ── Food → Gym: a fresh account has no gym profile, so Setup opens ───────────
- tapOn:
    id: 'mode-switch-gym'
- extendedWaitUntil:
    visible:
      id: 'gym-setup-title'
    timeout: 15000

# ── Step 1: days per week (3 is the default chip; tap it explicitly) ────────
- tapOn:
    id: 'gym-setup-days-3'
- tapOn:
    id: 'gym-setup-next'

# ── Step 2: experience ────────────────────────────────────────────────────────
- tapOn:
    id: 'gym-setup-experience-beginner'
- tapOn:
    id: 'gym-setup-next'

# ── Step 3: equipment + units ─────────────────────────────────────────────────
- tapOn:
    id: 'gym-setup-equipment-full_gym'
- tapOn:
    id: 'gym-setup-next'

# ── Step 4: weekdays + reminder — skip it ────────────────────────────────────
- tapOn:
    id: 'gym-setup-skip'

# ── Step 5: preview (needs the API — profile.recommend) ──────────────────────
- extendedWaitUntil:
    visible:
      id: 'gym-setup-preview-day-0'
    timeout: 15000
- tapOn:
    id: 'gym-setup-next'

# ── Step 6: starting weights — let the engine find them ──────────────────────
- tapOn:
    id: 'gym-setup-weights-help'
- tapOn:
    id: 'gym-setup-next'

# ── Step 7: finish (profile.completeSetup) ───────────────────────────────────
- assertVisible:
    id: 'gym-setup-expectation'
- tapOn:
    id: 'gym-setup-finish'

# ── Lands on Today with a next-up workout ────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: 'gym-today-title'
    timeout: 20000
- assertVisible:
    id: 'gym-today-next-up'

# ── Teardown: back to Food and sign out, so later flows sign in as alice ─────
- tapOn:
    id: 'mode-switch-food'
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000
- tapOn: '.*More.*'
- tapOn:
    id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 15000
