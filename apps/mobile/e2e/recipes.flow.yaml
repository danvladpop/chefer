# Cookbook (was Recipes) list + detail E2E — M2-3, P2-8. Signs in as the seeded alice account
# (data-rich catalog); costs 1 login of the 10/15min per-IP budget.
appId: dev.chefer.app.dev
---
- runFlow: common/connect.yaml

# Whoever is signed in, sign out — the flow needs alice's catalog.
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'home-title'
    commands:
      - tapOn: 'More(, tab.*)?'
      # Sign out sits low on More — on a 16e its centre is under the tab bar.
      - scrollUntilVisible:
          element:
            id: 'logout-button'
          direction: DOWN
          centerElement: true
      - tapOn:
          id: 'logout-button'
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 15000
- tapOn:
    id: 'login-email'
- inputText: 'alice@chefer.dev'
- tapOn:
    id: 'login-password'
- inputText: 'User@123!'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: 'login-submit'
    optional: true
# iOS may offer to save the password — decline so it never blocks the run.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 5000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 15000

- tapOn: '.*Cookbook.*'
- extendedWaitUntil:
    visible:
      id: 'recipes-title'
    timeout: 15000
- assertVisible:
    id: 'recipes-search'
# Open the first recipe card and check the detail screen
- tapOn:
    id: 'recipe-card-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- assertVisible:
    id: 'recipe-ingredients'
- assertVisible:
    id: 'recipe-save'

# Cook mode (P1-3): step through, never log
- tapOn:
    id: 'recipe-cook'
- extendedWaitUntil:
    visible:
      id: 'cook-title'
    timeout: 15000
- assertVisible:
    id: 'cook-step-text'
- tapOn:
    id: 'cook-next'
# (ingredients toggle is top-right — under the Android dev-build Tools bubble)
- tapOn:
    id: 'cook-close'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 10000
- tapOn:
    id: 'recipe-back'

# Import + create entry points (wave-2b) — UI only, no AI/preview calls
- tapOn:
    id: 'recipes-import'
- extendedWaitUntil:
    visible:
      id: 'import-title'
    timeout: 10000
- assertVisible:
    id: 'import-url'
- tapOn: 'Back'
# (recipes-new is the rightmost header button — under the Android dev-build
# Tools bubble; the create form stays covered by the iOS run of this flow)
- extendedWaitUntil:
    visible:
      id: 'recipes-title'
    timeout: 10000

# T-40.4 (UX-40 slice 1, iOS only — see the comment above): the D-19
# minimum, PAT-17's "never silently disabled" blocked tap, and a fraction
# chip. `rf-save` while incomplete never submits — the missing summary
# says why instead of the button just sitting there disabled.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'recipes-new'
      - extendedWaitUntil:
          visible:
            id: 'recipe-form-title'
          timeout: 15000
      - tapOn:
          id: 'rf-save'
      - assertVisible: 'Add a name.'
      - tapOn:
          id: 'rf-name-input'
      - inputText: 'Maestro test recipe'
      # Fraction chips (AC6): the row only shows while the quantity field
      # has focus.
      - tapOn:
          id: 'rf-ingredient-qty-0'
      - assertVisible:
          id: 'rf-fraction-0-½'
      - tapOn:
          id: 'rf-fraction-0-½'
      - tapOn:
          id: 'rf-ingredient-name-0'
      - inputText: 'flour'
      - hideKeyboard
      - tapOn:
          id: 'rf-save'
      - extendedWaitUntil:
          visible:
            id: 'recipes-title'
          timeout: 15000
      - assertVisible: 'Saved to your Cookbook'
