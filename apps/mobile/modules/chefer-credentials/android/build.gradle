plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.chefer'
version = '1.0.0'

android {
  namespace "expo.modules.chefercredentials"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Credential Manager (F8). credentials-play-services-auth backs it with Google
  // Password Manager on Android 13 and below.
  implementation 'androidx.credentials:credentials:1.6.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}
