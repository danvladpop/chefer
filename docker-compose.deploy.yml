# Production deployment — single always-on VM (Oracle Always Free), single origin.
#
#   Caddy (TLS + path routing)  ──►  web (Next.js SSR)  :3000
#                               ──►  api (Express+tRPC, workers, SSE, uploads) :3001
#                                    api ──► postgres :5432 (internal only)
#
# Usage (from repo root on the VM):
#   docker compose --env-file .env.production -f docker-compose.deploy.yml up -d --build
# (or just run infrastructure/scripts/deploy.sh)

services:
  postgres:
    image: postgres:16-alpine
    container_name: chefer-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chefer

  # One-shot: applies the Prisma schema before the API starts. Runs on every
  # deploy (idempotent), so schema changes ship automatically. Reuses the API
  # image, which has the Prisma CLI available.
  migrate:
    # Images are built in CI and pulled from GHCR. The build: block stays as an
    # emergency fallback (infrastructure/scripts/deploy-local-build.sh).
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: ghcr.io/danvladpop/chefer-api:${TAG:-latest}
    container_name: chefer-migrate
    restart: 'no'
    env_file:
      - .env.production
    command: sh -c "cd packages/database && npx prisma db push --skip-generate"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chefer

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: ghcr.io/danvladpop/chefer-api:${TAG:-latest}
    container_name: chefer-api
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chefer

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    image: ghcr.io/danvladpop/chefer-web:${TAG:-latest}
    container_name: chefer-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: '3000'
      # SSR calls the API over the internal network (no public round-trip)
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (Alpine) has no --spider flag; -O /dev/null is the portable form
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chefer

  caddy:
    image: caddy:2-alpine
    container_name: chefer-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      # ':ro,Z' relabels for SELinux hosts (Oracle Linux); harmless elsewhere
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - chefer

volumes:
  pgdata:
    name: chefer_pgdata
  uploads:
    name: chefer_uploads
  caddy_data:
    name: chefer_caddy_data
  caddy_config:
    name: chefer_caddy_config

networks:
  chefer:
    name: chefer
    driver: bridge
