# Production deployment — single always-on VM (Oracle Always Free), single origin.
#
#   Caddy (TLS + path routing)  ──►  web (Next.js SSR)  :3000
#                               ──►  api (Express+tRPC, workers, SSE, uploads) :3001
#                                    api ──► postgres :5432 (internal only)
#
# Usage (from repo root on the VM):
#   docker compose --env-file .env.production -f docker-compose.deploy.yml up -d --build
# (or just run infrastructure/scripts/deploy.sh)

# ─── Phase 1 guardrails (2026-10-11): log rotation + memory limits ────────────
# Every service logs through the json-file driver with rotation (3 × 10 MB per
# container), so container logs can no longer fill the VM's disk.
#
# Memory limits are sized for the CURRENT VM: Oracle E2.1.Micro, 1 GB RAM +
# 4 GB swap. Budget: postgres 256m + api 450m + web 256m + caddy 64m ≈ 1 GB;
# swap absorbs short peaks (Docker allows swap up to 2× mem_limit by default).
# A container over its limit is OOM-killed and restarted (`restart: always`)
# instead of taking the whole VM down. Each limit is a variable with the
# default below, so raising one is a line in .env.production — no edit here.
# ON THE ARM SHAPE (A1.Flex, 4 OCPU / 24 GB since 2026-10-11) RAISE THEM in
# .env.production: POSTGRES_MEM_LIMIT=4g, API_MEM_LIMIT=4g +
# API_MAX_OLD_SPACE_MB=3072, WEB_MEM_LIMIT=2g, CADDY_MEM_LIMIT=256m.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chefer-postgres
    restart: always
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chefer

  # One-shot: applies the Prisma schema, then syncs the global ingredient
  # catalog (packages/database/data/ingredients/catalog.json → ingredients,
  # aliases, portions; docs/plan-ingredient-catalog.md §4.4 step 7), before the
  # API starts. Both steps run on every deploy and are idempotent, so schema and
  # catalog changes ship automatically; either failing fails the deploy. Between
  # the two, prisma/ensure-indexes.sql re-creates the partial indexes db push
  # can't express (WP-18 one-active-trainer). Reuses
  # the API image, which has the Prisma CLI and tsx available.
  migrate:
    # Images are built in CI and pulled from GHCR. The build: block stays as an
    # emergency fallback (infrastructure/scripts/deploy-local-build.sh).
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: ghcr.io/danvladpop/chefer-api:${TAG:-latest}
    container_name: chefer-migrate
    restart: 'no'
    # One-shot that runs before the API starts, so it gets no limit of its own.
    logging: *default-logging
    env_file:
      - .env.production
    command: sh -c "cd packages/database && npx prisma db push --skip-generate && npx prisma db execute --schema prisma/schema.prisma --file prisma/ensure-indexes.sql && npx tsx src/catalog/sync-cli.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chefer

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: ghcr.io/danvladpop/chefer-api:${TAG:-latest}
    container_name: chefer-api
    restart: always
    logging: *default-logging
    mem_limit: ${API_MEM_LIMIT:-450m}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOST: 0.0.0.0
      # V8 heap below the container limit, leaving room for sharp/libvips,
      # yt-dlp + ffmpeg children and native buffers (raise with API_MEM_LIMIT).
      NODE_OPTIONS: --max-old-space-size=${API_MAX_OLD_SPACE_MB:-320}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chefer

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    image: ghcr.io/danvladpop/chefer-web:${TAG:-latest}
    container_name: chefer-web
    restart: always
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    environment:
      NODE_ENV: production
      PORT: '3000'
      # SSR calls the API over the internal network (no public round-trip)
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (Alpine) has no --spider flag; -O /dev/null is the portable form.
      # 127.0.0.1, not localhost: localhost resolves to ::1 first and Next listens on IPv4 only.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chefer

  caddy:
    image: caddy:2-alpine
    container_name: chefer-caddy
    restart: always
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-64m}
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      # ':ro,Z' relabels for SELinux hosts (Oracle Linux); harmless elsewhere
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - chefer

volumes:
  pgdata:
    name: chefer_pgdata
  uploads:
    name: chefer_uploads
  caddy_data:
    name: chefer_caddy_data
  caddy_config:
    name: chefer_caddy_config

networks:
  chefer:
    name: chefer
    driver: bridge
